<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khảo sát vấn đề Setup - Xây dựng</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;min-height:100vh;padding-bottom:80px}
.header{background:linear-gradient(135deg,#1a3a5c,#1e5799);color:#fff;padding:16px 20px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:18px;font-weight:800}
.header p{font-size:12px;opacity:.85;margin-top:2px}
.container{max-width:750px;margin:0 auto;padding:12px}

/* Store info card */
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:14px;color:#1a3a5c;margin-bottom:10px;display:flex;align-items:center;gap:6px}
label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:3px;margin-top:8px}
select,input[type=text],textarea{width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;transition:border-color .2s;font-family:inherit}
select:focus,input:focus,textarea:focus{outline:none;border-color:#1e5799;box-shadow:0 0 0 3px rgba(30,87,153,.08)}
select:disabled{background:#f1f5f9;color:#94a3b8}
textarea{min-height:50px;resize:vertical}

/* ── PROGRESS SUMMARY BAR ── */
.progress-summary{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ps-card{flex:1;min-width:100px;background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.04);border-left:3px solid #cbd5e1;transition:all .3s}
.ps-card.done{border-left-color:#16a34a;background:#f0fdf4}
.ps-card .ps-label{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.ps-card .ps-count{font-size:20px;font-weight:800;color:#1e293b;margin-top:2px}
.ps-card .ps-pct{font-size:11px;color:#64748b}
.ps-card.done .ps-count{color:#16a34a}
.ps-card .ps-mini-bar{background:#e2e8f0;border-radius:3px;height:4px;margin-top:6px;overflow:hidden}
.ps-card .ps-mini-fill{background:#1e5799;height:100%;border-radius:3px;transition:width .3s}
.ps-card.done .ps-mini-fill{background:#16a34a}

/* Overall bar */
.overall-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.overall-bar{flex:1;background:#e2e8f0;border-radius:6px;height:10px;overflow:hidden}
.overall-fill{background:linear-gradient(90deg,#1e5799,#38a169);height:100%;border-radius:6px;transition:width .3s}
.overall-text{font-size:11px;font-weight:700;color:#64748b;white-space:nowrap}

/* ── AREA SECTIONS ── */
.area-group{margin-bottom:12px}
.area-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-radius:10px 10px 0 0;border:1px solid #e2e8f0;border-bottom:none;cursor:pointer;user-select:none}
.area-header .area-icon{font-size:18px}
.area-header .area-label{font-weight:700;font-size:13px;color:#1e293b;flex:1}
.area-header .area-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;background:#e2e8f0;color:#64748b;transition:all .3s}
.area-header .area-badge.done{background:#dcfce7;color:#16a34a}
.area-header .area-arrow{transition:transform .2s;color:#94a3b8;font-size:12px}
.area-header.collapsed .area-arrow{transform:rotate(-90deg)}
.area-body{background:#fff;border-radius:0 0 10px 10px;border:1px solid #e2e8f0;border-top:none;overflow:hidden;transition:max-height .3s}
.area-body.collapsed,.area-body{max-height:0!important}
.area-body-inner{padding:0 12px 8px}

/* Items */
.item-row{border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;margin-bottom:6px;transition:all .2s;background:#fafbfc}
.item-row:hover{border-color:#cbd5e1}
.item-row.evaluated{border-left:3px solid #16a34a;background:#f0fdf4}
.item-row.issue{border-left:3px solid #dc2626;background:#fef2f2}
.item-header{display:flex;align-items:center;gap:8px}
.item-number{background:#e2e8f0;color:#475569;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.item-code{font-size:10px;color:#94a3b8;flex-shrink:0;min-width:55px}
.item-name{flex:1;font-size:12px;font-weight:600;color:#1e293b}
.toggle-group{display:flex;gap:0;flex-shrink:0}
.toggle-btn{padding:5px 14px;border:1px solid #cbd5e1;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;background:#fff;color:#64748b}
.toggle-btn:first-child{border-radius:5px 0 0 5px}
.toggle-btn:last-child{border-radius:0 5px 5px 0}
.toggle-btn.active-pass{background:#16a34a;color:#fff;border-color:#16a34a}
.toggle-btn.active-fail{background:#dc2626;color:#fff;border-color:#dc2626}
.pass-text{font-size:12px;color:#16a34a;font-weight:600;display:none;margin-top:5px;padding:5px 10px;background:#f0fdf4;border-radius:5px}
.pass-text.show{display:block}
.issue-detail{display:none;margin-top:6px;padding:8px 10px;background:#fff5f5;border-radius:6px;border:1px dashed #fca5a5}
.issue-detail.show{display:block}
.issue-detail textarea{font-size:12px;min-height:40px;margin-top:3px}
.issue-detail label{font-size:11px;margin-top:6px}
.inline-photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.inline-photo-box{width:64px;height:64px;border:2px dashed #cbd5e1;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;flex-shrink:0;transition:border-color .15s}
.inline-photo-box:hover{border-color:#dc2626}
.inline-photo-box img{width:100%;height:100%;object-fit:cover}
.inline-photo-box .remove{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.6);color:#fff;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:9px}
.inline-photo-box .placeholder{font-size:9px;color:#94a3b8;text-align:center}
.photo-required{font-size:9px;color:#dc2626;margin-top:1px}
.store-info{background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:8px 10px;margin-top:6px;font-size:12px;display:none}
.store-info span{font-weight:600}
.hint{font-size:10px;color:#94a3b8;margin-top:3px}
.btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,#1e5799,#2b6cb0);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s;position:sticky;bottom:12px;margin-top:8px;box-shadow:0 4px 12px rgba(30,87,153,.3)}
.btn-submit:hover{transform:scale(1.01)}
.btn-submit:active{transform:scale(.98)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.loading{display:none;text-align:center;padding:20px}
.spinner{width:36px;height:36px;border:4px solid #e2e8f0;border-top:4px solid #1e5799;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.success{display:none;text-align:center;padding:20px;color:#16a34a;font-weight:700;font-size:17px}
.success .count{font-size:13px;font-weight:400;color:#64748b;margin-top:6px}
.validation-error{color:#dc2626;font-size:11px;margin-top:6px;display:none;padding:10px;background:#fef2f2;border-radius:8px;text-align:center}
.version-badge{font-size:10px;opacity:.5}
@media (max-width:480px){
  .toggle-btn{padding:5px 10px;font-size:10px}
  .item-row{padding:6px 8px}
  .ps-card{padding:8px 10px}
  .ps-card .ps-count{font-size:17px}
  .progress-summary{gap:4px}
}
</style>
</head>
<body>

<div class="header">
  <h1>🏪 Khảo sát vấn đề Setup - Xây dựng</h1>
  <p>WinRural · 34 hạng mục · 3 khu vực · Setup & Xây dựng <span class="version-badge">v5.3</span></p>
</div>

<div class="container" id="formContainer">
  <!-- ① Chọn GĐV/QLKV/CH -->
  <div class="card">
    <h3>📋 Thông tin Cửa hàng</h3>
    <label>GĐV (Giám đốc Vùng)</label>
    <select id="gdvSelect"><option value="">-- Đang tải dữ liệu... --</option></select>
    
    <label>QLKV (Quản lý Khu vực)</label>
    <select id="qlkvSelect" disabled><option value="">-- Chọn QLKV --</option></select>
    
    <label>Cửa hàng</label>
    <select id="storeSelect" disabled><option value="">-- Chọn Cửa hàng --</option></select>
    <div class="store-info" id="storeInfo">
      Mã CH: <span id="siCode">-</span> · Tỉnh: <span id="siProvince">-</span> · Tên: <span id="siName">-</span>
    </div>
    <div class="hint" id="dataHint">Đang tải dữ liệu từ Storelist...</div>
  </div>

  <!-- ② Progress Summary -->
  <div class="card" id="summaryCard" style="display:none">
    <h3>📊 Tiến độ khảo sát</h3>
    <div class="overall-bar-wrap">
      <div class="overall-bar"><div class="overall-fill" id="overallFill" style="width:0%"></div></div>
      <span class="overall-text" id="overallText">0/34</span>
    </div>
    <div class="progress-summary" id="progressSummary"></div>
  </div>

  <!-- ③ Checklist -->
  <div id="checklistCard" style="display:none">
    <div class="validation-error" id="validationError"></div>
    <div class="checklist" id="checklist"></div>
  </div>

  <!-- ④ Ghi chú -->
  <div class="card" id="noteCard" style="display:none">
    <h3>📝 Ghi chú chung</h3>
    <textarea id="generalNote" placeholder="Ghi chú chung cho đợt khảo sát (nếu có)..."></textarea>
  </div>

  <!-- Submit -->
  <button class="btn-submit" id="btnSubmit" onclick="submitForm()" style="display:none">📤 Gửi kết quả khảo sát</button>
  <div class="loading" id="loading"><div class="spinner"></div><p style="margin-top:6px;color:#64748b;font-size:13px">Đang gửi về Sheets...</p></div>
  <div class="success" id="success">
    ✅ Đã gửi khảo sát thành công!
    <div class="count" id="successDetail"></div>
  </div>
</div>

<script>
// ── DATA ──
let cascadeData = {};
let checklistData = [];
let evaluations = {};
let itemNotes = {};
let itemPhotos = {};
let areaInfo = [];       // [{ name, count, items:[] }]
let allItemIds = [];     // ordered item IDs

// ── INIT ──
function init() {
  document.getElementById('dataHint').textContent = 'Đang tải dữ liệu từ Storelist...';
  
  google.script.run
    .withSuccessHandler(function(rows) {
      if (!rows || rows.length === 0) {
        document.getElementById('dataHint').textContent = '⚠️ Không có dữ liệu CH Miền Bắc.';
        document.getElementById('gdvSelect').innerHTML = '<option value="">-- Không có dữ liệu --</option>';
        loadChecklist();
        return;
      }
      cascadeData = {};
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var gdv = r.gdv || 'Chưa phân công';
        var qlkv = r.qlkv || 'Chưa phân công';
        if (!cascadeData[gdv]) cascadeData[gdv] = {};
        if (!cascadeData[gdv][qlkv]) cascadeData[gdv][qlkv] = [];
        cascadeData[gdv][qlkv].push({ sid: r.ma, name: r.ten, tinh: r.tinh });
      }
      
      var gdvSel = document.getElementById('gdvSelect');
      gdvSel.innerHTML = '<option value="">-- Chọn GĐV --</option>';
      var gdvKeys = Object.keys(cascadeData).sort();
      for (var j = 0; j < gdvKeys.length; j++) {
        var g = gdvKeys[j];
        gdvSel.innerHTML += '<option value="' + g + '">' + g + ' (' + Object.keys(cascadeData[g]).length + ' QLKV)</option>';
      }
      document.getElementById('dataHint').textContent = '✅ Dữ liệu từ Storelist (' + rows.length + ' CH Miền Bắc)';
      document.getElementById('dataHint').style.color = '#16a34a';
      loadChecklist();
    })
    .withFailureHandler(function(err) {
      document.getElementById('dataHint').textContent = '⚠️ Lỗi tải dữ liệu: ' + err.message;
      loadChecklist();
    })
    .getStoreData();
}

function loadChecklist() {
  google.script.run
    .withSuccessHandler(function(areas) {
      if (!areas || areas.length === 0) {
        alert('⚠️ Không có checklist. Chạy reloadChecklist() trong Apps Script trước.');
        return;
      }
      checklistData = areas;
      buildChecklist();
    })
    .withFailureHandler(function(err) {
      alert('⚠️ Lỗi tải checklist: ' + err.message);
    })
    .getChecklist();
}

function buildChecklist() {
  var cl = document.getElementById('checklist');
  var ps = document.getElementById('progressSummary');
  cl.innerHTML = '';
  ps.innerHTML = '';
  
  evaluations = {};
  itemNotes = {};
  itemPhotos = {};
  areaInfo = [];
  allItemIds = [];
  
  var areaIcons = ['🏪', '🛒', '📦'];
  
  for (var a = 0; a < checklistData.length; a++) {
    var area = checklistData[a];
    var areaId = 'area_' + a;
    var areaItems = [];
    
    // Build items for this area
    var itemsHtml = '';
    for (var i = 0; i < area.items.length; i++) {
      var itemName = area.items[i];
      var itemId = 'item_' + a + '_' + i;
      allItemIds.push(itemId);
      evaluations[itemId] = null;
      itemNotes[itemId] = '';
      itemPhotos[itemId] = [];
      areaItems.push(itemId);
      
      var localNum = i + 1;
      var codeShort = 'CSVC' + String(a*20 + localNum).padStart(2,'0');
      
      itemsHtml += `
        <div class="item-row" id="row_${itemId}">
          <div class="item-header">
            <span class="item-number">${localNum}</span>
            <span class="item-name">${itemName}</span>
            <div class="toggle-group">
              <button class="toggle-btn" id="pass_${itemId}" onclick="setEval('${itemId}')">✅ Đạt</button>
              <button class="toggle-btn" id="fail_${itemId}" onclick="setEval('${itemId}','fail')">❌ Ko đạt</button>
            </div>
          </div>
          <div class="pass-text" id="passText_${itemId}">✅ Đạt</div>
          <div class="issue-detail" id="issue_${itemId}">
            <label>📝 Diễn giải <span style="color:#dc2626">*</span></label>
            <textarea id="note_${itemId}" placeholder="Mô tả tình trạng hư hỏng/xuống cấp..." oninput="itemNotes['${itemId}']=this.value;updateProgress()"></textarea>
            <label>📸 Ảnh (tối đa 3)</label>
            <div class="inline-photos" id="photos_${itemId}">
              <div class="inline-photo-box" onclick="document.getElementById('file_${itemId}').click()">
                <span class="placeholder">+ Ảnh</span>
              </div>
            </div>
            <input type="file" id="file_${itemId}" accept="image/*" capture="environment" style="display:none" onchange="addPhoto('${itemId}', this)">
            <div class="photo-required">⚡ Yêu cầu ít nhất 1 ảnh khi Không đạt</div>
          </div>
        </div>`;
    }
    
    areaInfo.push({ name: area.name, count: area.items.length, items: areaItems });
    
    cl.innerHTML += `
      <div class="area-group">
        <div class="area-header collapsed" id="ahdr_${a}" onclick="toggleArea(${a})">
          <span class="area-icon">${areaIcons[a] || '📍'}</span>
          <span class="area-label">${area.name}</span>
          <span class="area-stats" id="astats_${a}" style="font-size:10px;color:#64748b;margin-left:auto;margin-right:8px;display:flex;gap:6px">
            <span style="color:#16a34a">✅0</span>
            <span style="color:#dc2626">❌0</span>
            <span style="color:#94a3b8">⬜0</span>
          </span>
          <span class="area-badge" id="abadge_${a}">0/${area.items.length}</span>
          <span class="area-arrow">▼</span>
        </div>
        <div class="area-body" id="abody_${a}" style="max-height:0">
          <div class="area-body-inner">${itemsHtml}</div>
        </div>
      </div>`;
    
    // Summary card
    ps.innerHTML += `
      <div class="ps-card" id="pscard_${a}">
        <div class="ps-label">${area.name}</div>
        <div class="ps-count">0/${area.items.length}</div>
        <div class="ps-pct">0%</div>
        <div class="ps-mini-bar"><div class="ps-mini-fill" id="psfill_${a}" style="width:0%"></div></div>
      </div>`;
  }
  
  document.getElementById('summaryCard').style.display = 'block';
  document.getElementById('checklistCard').style.display = 'block';
  document.getElementById('noteCard').style.display = 'block';
  document.getElementById('btnSubmit').style.display = 'block';
  
  updateProgress();
}

function toggleArea(a) {
  var hdr = document.getElementById('ahdr_' + a);
  var body = document.getElementById('abody_' + a);
  var collapsed = hdr.classList.contains('collapsed');
  hdr.classList.toggle('collapsed');
  if (collapsed) { body.style.maxHeight = '9999px'; }
  else { body.style.maxHeight = '0'; }
}

// ── CASCADE ──
document.getElementById('gdvSelect').addEventListener('change', function() {
  var gdv = this.value;
  var qSel = document.getElementById('qlkvSelect');
  var sSel = document.getElementById('storeSelect');
  qSel.innerHTML = '<option value="">-- Chọn QLKV --</option>';
  sSel.innerHTML = '<option value="">-- Chọn Cửa hàng --</option>';
  sSel.disabled = true;
  document.getElementById('storeInfo').style.display = 'none';
  
  if (!gdv || !cascadeData[gdv]) { qSel.disabled = true; return; }
  qSel.disabled = false;
  var qlkvKeys = Object.keys(cascadeData[gdv]).sort();
  for (var i = 0; i < qlkvKeys.length; i++) {
    var q = qlkvKeys[i];
    qSel.innerHTML += '<option value="' + q + '">' + q + ' (' + cascadeData[gdv][q].length + ' CH)</option>';
  }
});

document.getElementById('qlkvSelect').addEventListener('change', function() {
  var gdv = document.getElementById('gdvSelect').value;
  var qlkv = this.value;
  var sSel = document.getElementById('storeSelect');
  sSel.innerHTML = '<option value="">-- Chọn Cửa hàng --</option>';
  document.getElementById('storeInfo').style.display = 'none';
  
  if (!gdv || !qlkv || !cascadeData[gdv] || !cascadeData[gdv][qlkv]) { sSel.disabled = true; return; }
  sSel.disabled = false;
  var stores = cascadeData[gdv][qlkv].sort(function(a,b) { return a.sid.localeCompare(b.sid); });
  for (var i = 0; i < stores.length; i++) {
    var s = stores[i];
    sSel.innerHTML += '<option value="' + s.sid + '" data-name="' + s.name + '" data-tinh="' + s.tinh + '">' + s.sid + ' - ' + s.name + '</option>';
  }
});

document.getElementById('storeSelect').addEventListener('change', function() {
  var opt = this.selectedOptions[0];
  var info = document.getElementById('storeInfo');
  if (opt && opt.dataset.name) {
    document.getElementById('siCode').textContent = opt.value;
    document.getElementById('siProvince').textContent = opt.dataset.tinh;
    document.getElementById('siName').textContent = opt.dataset.name;
    info.style.display = 'block';
  } else {
    info.style.display = 'none';
  }
});

// ── EVALUATION ──
function setEval(itemId, value) {
  var isPass = !value;
  evaluations[itemId] = isPass ? 'pass' : 'fail';
  var row = document.getElementById('row_' + itemId);
  var passBtn = document.getElementById('pass_' + itemId);
  var failBtn = document.getElementById('fail_' + itemId);
  var passText = document.getElementById('passText_' + itemId);
  var issue = document.getElementById('issue_' + itemId);
  
  row.classList.remove('evaluated', 'issue');
  passBtn.classList.remove('active-pass');
  failBtn.classList.remove('active-fail');
  passText.classList.remove('show');
  issue.classList.remove('show');
  
  if (isPass) {
    passBtn.classList.add('active-pass');
    passText.classList.add('show');
    row.classList.add('evaluated');
  } else {
    failBtn.classList.add('active-fail');
    issue.classList.add('show');
    row.classList.add('issue');
  }
  
  updateProgress();
  document.getElementById('validationError').style.display = 'none';
}

function updateProgress() {
  var totalItems = allItemIds.length;
  var totalDone = 0;
  
  // Per-area counts
  var areaDone = areaInfo.map(function() { return 0; });
  
  for (var i = 0; i < allItemIds.length; i++) {
    var itemId = allItemIds[i];
    if (evaluations[itemId]) {
      totalDone++;
      // Find which area
      for (var a = 0; a < areaInfo.length; a++) {
        if (areaInfo[a].items.indexOf(itemId) >= 0) {
          areaDone[a]++;
          break;
        }
      }
    }
  }
  
  // Overall
  var pct = totalItems > 0 ? Math.round((totalDone / totalItems) * 100) : 0;
  document.getElementById('overallFill').style.width = pct + '%';
  document.getElementById('overallText').textContent = totalDone + '/' + totalItems;
  
  // Per-area stats
  for (var a = 0; a < areaInfo.length; a++) {
    var ad = areaDone[a];
    var ac = areaInfo[a].count;
    var apct = ac > 0 ? Math.round((ad / ac) * 100) : 0;
    
    // Count pass/fail per area
    var passA = 0, failA = 0;
    for (var j = 0; j < areaInfo[a].items.length; j++) {
      var e = evaluations[areaInfo[a].items[j]];
      if (e === 'pass') passA++;
      else if (e === 'fail') failA++;
    }
    var uncheckA = ac - passA - failA;
    
    // Summary card
    var psc = document.getElementById('pscard_' + a);
    if (psc) {
      if (ad === ac) psc.classList.add('done'); else psc.classList.remove('done');
      psc.querySelector('.ps-count').textContent = ad + '/' + ac;
      psc.querySelector('.ps-pct').textContent = apct + '%';
      document.getElementById('psfill_' + a).style.width = apct + '%';
    }
    
    // Area badge
    var badge = document.getElementById('abadge_' + a);
    if (badge) {
      badge.textContent = ad + '/' + ac;
      if (ad === ac) badge.classList.add('done'); else badge.classList.remove('done');
    }
    
    // Area stats: ✅ pass / ❌ fail / ⬜ unchecked
    var stats = document.getElementById('astats_' + a);
    if (stats) {
      stats.innerHTML = '<span style="color:#16a34a">✅'+passA+'</span> <span style="color:#dc2626">❌'+failA+'</span> <span style="color:#94a3b8">⬜'+uncheckA+'</span>';
    }
  }
}

// ── PHOTO ──
function addPhoto(itemId, input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function(e) {
    if (!itemPhotos[itemId]) itemPhotos[itemId] = [];
    if (itemPhotos[itemId].length >= 3) return;
    itemPhotos[itemId].push({ dataUrl: e.target.result });
    renderPhotos(itemId);
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function removePhoto(itemId, idx) {
  itemPhotos[itemId].splice(idx, 1);
  renderPhotos(itemId);
}

function renderPhotos(itemId) {
  var container = document.getElementById('photos_' + itemId);
  var photos = itemPhotos[itemId] || [];
  var html = '';
  for (var i = 0; i < photos.length; i++) {
    html += '<div class="inline-photo-box"><img src="' + photos[i].dataUrl + '"><span class="remove" onclick="removePhoto(\'' + itemId + '\',' + i + ')">✕</span></div>';
  }
  if (photos.length < 3) {
    html += '<div class="inline-photo-box" onclick="document.getElementById(\'file_' + itemId + '\').click()"><span class="placeholder">+ Ảnh</span></div>';
  }
  container.innerHTML = html;
}

// ── SUBMIT ──
function submitForm() {
  var gdv = document.getElementById('gdvSelect').value;
  var qlkv = document.getElementById('qlkvSelect').value;
  var store = document.getElementById('storeSelect').value;
  
  if (!gdv || !qlkv || !store) {
    showError('⚠️ Vui lòng chọn đầy đủ GĐV, QLKV và Cửa hàng!');
    return;
  }
  
  var unevaluated = allItemIds.filter(function(k) { return !evaluations[k]; });
  if (unevaluated.length > 0) {
    showError('⚠️ Còn ' + unevaluated.length + ' hạng mục chưa đánh giá!');
    var first = document.getElementById('row_' + unevaluated[0]);
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  
  var failNoNote = allItemIds.filter(function(k) {
    return evaluations[k] === 'fail' && !itemNotes[k]?.trim();
  });
  if (failNoNote.length > 0) {
    showError('⚠️ ' + failNoNote.length + ' hạng mục "Không đạt" chưa có diễn giải!');
    var fb = document.getElementById('row_' + failNoNote[0]);
    if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  
  var generalNote = document.getElementById('generalNote').value;
  var storeName = document.getElementById('storeSelect').selectedOptions[0]?.dataset?.name || '';
  var tinh = document.getElementById('storeSelect').selectedOptions[0]?.dataset?.tinh || '';
  
  // Build items
  var items = [];
  for (var a = 0; a < areaInfo.length; a++) {
    for (var i = 0; i < areaInfo[a].items.length; i++) {
      var itemId = areaInfo[a].items[i];
      items.push({
        area: areaInfo[a].name,
        item: checklistData[a].items[i],
        result: evaluations[itemId] === 'pass' ? 'Đạt' : 'Không đạt',
        note: evaluations[itemId] === 'pass' ? 'Đạt' : (itemNotes[itemId] || ''),
        photos: itemPhotos[itemId] || []
      });
    }
  }
  
  var payload = {
    store: store, storeName: storeName, tinh: tinh,
    gdv: gdv, qlkv: qlkv,
    items: items,
    generalNote: generalNote,
    totalItems: allItemIds.length,
    passCount: items.filter(function(it) { return it.result === 'Đạt'; }).length,
    failCount: items.filter(function(it) { return it.result === 'Không đạt'; }).length
  };
  
  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('validationError').style.display = 'none';
  
  google.script.run
    .withSuccessHandler(function(result) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('success').style.display = 'block';
      document.getElementById('successDetail').textContent = 
        'Đã lưu ' + result.rowsSaved + ' dòng vào Sheet CSVC_Tracking · ' + payload.store + ' - ' + payload.storeName;
      document.getElementById('formContainer').querySelectorAll('.card, .btn-submit').forEach(function(el) { el.style.display = 'none'; });
      document.getElementById('checklistCard').style.display = 'none';
    })
    .withFailureHandler(function(err) {
      alert('Lỗi gửi dữ liệu: ' + err.message);
      document.getElementById('btnSubmit').disabled = false;
      document.getElementById('loading').style.display = 'none';
    })
    .submitSurvey(payload);
}

function showError(msg) {
  var el = document.getElementById('validationError');
  el.textContent = msg;
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth' });
}

// ── START ──
init();
</script>
