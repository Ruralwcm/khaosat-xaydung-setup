<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Khảo sát CSVC · WinMart+ Rural</title>
<style>
:root{
  --red:#d71920;
  --blue:#1a3c6e;
  --gold:#ffc107;
  --green:#16a34a;
  --bg:#f4f5f7;
  --card:#ffffff;
  --txt:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Be Vietnam Pro',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--txt);line-height:1.5;padding-bottom:90px;
}
.topbar{background:linear-gradient(135deg,var(--red),#0f2b50);color:#fff;padding:10px 14px;}
.topbar .t-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.topbar .t-title{font-size:16px;font-weight:800;line-height:1.2;}
.topbar .t-title .vbadge{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);color:#fff;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;}
.topbar .t-sub{font-size:11px;opacity:.85;margin-top:1px;}

.wrap{max-width:640px;margin:0 auto;padding:0 12px;}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-top:14px;overflow:hidden;}
.card-head{display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:700;font-size:15px;border-bottom:1px solid var(--border);}
.card-head .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex-shrink:0;}
.card-head .tag{margin-left:auto;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:#eef2f7;color:#374151;white-space:nowrap;}
.card-body{padding:14px 16px;}

label{display:block;font-size:12px;font-weight:600;color:#374151;margin:10px 0 4px;}
label:first-child{margin-top:0;}
label .req-star{color:var(--red);}
input,select,textarea{
  width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:9px;
  font-size:15px;font-family:inherit;background:#fff;color:var(--txt);
  transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,60,110,.12);}
textarea{min-height:50px;resize:vertical;font-size:13px;}
select:disabled{background:#f1f5f9;color:#94a3b8}
.row{display:flex;gap:8px;}
.row > div{flex:1;min-width:0;}

.store-info{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12px;display:none;}
.store-info b{font-weight:700;}

/* area group header */
.area-group{margin-top:12px;}
.area-group:first-child{margin-top:0;}
.area-title{font-size:14px;font-weight:800;color:var(--blue);padding:8px 12px;background:#eff6ff;border-radius:8px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.area-title .cnt{font-size:11px;font-weight:400;color:var(--muted);margin-left:auto;}

/* item card */
.item-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:6px;display:flex;align-items:flex-start;gap:10px;background:#fafbfc;}
.item-card.pass{background:#f0fdf4;border-color:#bbf7d0;}
.item-card.fail{background:#fef2f2;border-color:#fecaca;}
.item-card .idx{background:var(--blue);color:#fff;border-radius:50%;width:26px;height:26px;min-width:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:2px;}
.item-card.pass .idx{background:var(--green);}
.item-card.fail .idx{background:var(--red);}
.item-card.custom .idx{background:var(--gold);color:#1f2937;font-size:14px;}
.item-card .body{flex:1;min-width:0;}
.item-card .t{font-weight:700;font-size:14px;}
.item-card .t .badge{font-size:10px;font-weight:600;border-radius:20px;padding:1px 7px;margin-left:6px;vertical-align:middle;display:inline-block;}
.item-card .t .badge.pass{background:#dcfce7;color:#16a34a;}
.item-card .t .badge.fail{background:#fef2f2;color:#dc2626;}
.item-card .t .badge.pending{background:#eef2f7;color:var(--muted);}
.item-card .t .badge.new{background:#fef3c7;color:#92400e;}
.item-card .t .badge.edited{background:#fde68a;color:#92400e;}
.item-card .s{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word;}
.item-card .acts{display:flex;flex-direction:column;gap:4px;}
.item-card .act{background:none;border:none;cursor:pointer;padding:2px 6px;font-size:16px;}
.item-card .act.edit{color:var(--blue);}

/* compact act bar */
.compact-act-bar{display:none;text-align:center;padding:8px;}
.compact-act-bar.show{display:block;}

/* photos in list item */
.item-photos{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;}
.item-photos img{width:36px;height:36px;border-radius:4px;object-fit:cover;border:1px solid var(--border);}

/* edit form (Card ③) */
.edit-card{display:none;}
.edit-card.show{display:block;}

.edit-eval-row{display:flex;gap:10px;}
.edit-eval-row .btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;border:2px solid transparent;}
.edit-eval-row .btn-pass{background:#f0fdf4;color:var(--green);}
.edit-eval-row .btn-pass.sel{border-color:var(--green);background:#dcfce7;}
.edit-eval-row .btn-fail{background:#fef2f2;color:var(--red);}
.edit-eval-row .btn-fail.sel{border-color:var(--red);background:#fee2e2;}

.fail-detail{display:none;margin-top:10px;padding:10px;background:#fff5f5;border-radius:8px;border:1px dashed #fca5a5;}
.fail-detail.show{display:block;}
.fail-detail label{font-size:11px;font-weight:600;color:#b91c1c;}

.inline-photos{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.photo-box{width:54px;height:54px;border:2px dashed #cbd5e1;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;flex-shrink:0;}
.photo-box:hover{border-color:var(--red);}
.photo-box img{width:100%;height:100%;object-fit:cover;}
.photo-box .remove{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.6);color:#fff;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:9px;}
.photo-box .placeholder{font-size:8px;color:#94a3b8;text-align:center;}
.photo-hint{font-size:10px;color:var(--red);margin-top:3px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 14px;border-radius:9px;border:none;font-size:14px;font-weight:700;
  cursor:pointer;transition:opacity .15s, transform .05s;font-family:inherit;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--red);color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
.btn-block{width:100%;margin-top:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:7px;}

.submit-bar{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);
  padding:10px 14px;display:none;gap:8px;z-index:100;max-width:640px;margin:0 auto;
  box-shadow:0 -2px 10px rgba(0,0,0,.05);
}
.submit-bar.show{display:flex;}
.submit-bar .btn{flex:1;padding:13px;font-size:15px;}

.toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;
  padding:12px 18px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;
  pointer-events:none;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;}

.completed-box{background:#d1fae5;border:2px solid #16a34a;border-radius:12px;padding:16px 18px;margin:12px 0;text-align:center;}
.completed-box .icon{font-size:28px;margin-bottom:4px;}
.completed-box .title{font-size:16px;font-weight:800;color:#166534;margin-bottom:2px;}
.completed-box .store-name{font-size:13px;color:#065f46;margin-bottom:8px;}
.completed-box .summary{font-size:12px;color:#047857;background:#a7f3d0;display:inline-block;padding:3px 12px;border-radius:20px;font-weight:600;}

@media(max-width:480px){
  .edit-eval-row .btn{font-size:13px;padding:10px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="t-row">
    <div>
      <div class="t-title">🏪 Khảo sát CSVC <span class="vbadge">v8</span></div>
      <div class="t-sub">List đầu mục vấn đề · Sửa tình trạng · (+) Bổ sung — Group theo khu vực</div>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- ===== ① CH khảo sát ===== -->
  <div class="card">
    <div class="card-head"><span class="dot"></span>① Cửa hàng khảo sát</div>
    <div class="card-body">
      <div class="row">
        <div>
          <label>GĐV <span class="req-star">*</span></label>
          <select id="selGdv"><option value="">-- Đang tải --</option></select>
        </div>
        <div>
          <label>QLKV <span class="req-star">*</span></label>
          <select id="selQlkv" disabled><option value="">-- Chọn QLKV --</option></select>
        </div>
      </div>
      <label>Cửa hàng <span class="req-star">*</span></label>
      <select id="selCh" disabled><option value="">-- Chọn Cửa hàng --</option></select>
      <div class="store-info" id="chInfo">
        Mã CH: <b id="siMa">-</b> · Tỉnh: <b id="siTinh">-</b> · Tên: <b id="siTen">-</b>
      </div>
    </div>
  </div>

  <!-- ===== ② Danh sách vấn đề ===== -->
  <div class="card" id="listCard" style="display:none">
    <div class="card-head"><span class="dot"></span>② Danh sách vấn đề <span class="tag" id="tagCount">0 mục</span></div>
    <div class="card-body">
      <div id="itemList"><div class="item-card" style="justify-content:center;color:var(--muted);">Chọn CH để xem danh sách vấn đề</div></div>
      <div style="display:flex;gap:8px;margin-top:8px;" id="confirmBar">
        <button class="btn btn-ghost" id="btnNoChange" onclick="onNoChange()" disabled style="flex:1;border-color:var(--green);color:var(--green);">✅ Không thay đổi</button>
        <button class="btn btn-blue" id="btnAddNew" onclick="toggleEditForm(null)" disabled style="flex:1;">➕ Thêm</button>
      </div>
    </div>
  </div>

  <!-- ===== ③ Form thêm/sửa vấn đề ===== -->
  <div class="card edit-card" id="editCard">
    <div class="card-head"><span class="dot" style="background:var(--gold)"></span>③ <span id="formTitle">Thêm vấn đề</span></div>
    <div class="card-body">
      <label>Khu vực <span class="req-star">*</span></label>
      <select id="editArea">
        <option value="">-- Chọn khu vực --</option>
        <option>TRƯỚC CH</option>
        <option>TRONG CH</option>
        <option>KHO - NVS</option>
      </select>

      <label>Tên hạng mục <span class="req-star">*</span></label>
      <input type="text" id="editItemName" placeholder="VD: Biển hiệu WM+">

      <label>Đánh giá <span class="req-star">*</span></label>
      <div class="edit-eval-row">
        <button class="btn btn-pass" id="btnPass" onclick="setEditEval('pass')">✅ Đạt</button>
        <button class="btn btn-fail" id="btnFail" onclick="setEditEval('fail')">❌ Ko đạt</button>
      </div>

      <div class="fail-detail" id="failDetail">
        <label>📝 Diễn giải tình trạng <span class="req-star">*</span></label>
        <textarea id="editNote" placeholder="Mô tả tình trạng hư hỏng/xuống cấp..."></textarea>
        <label>📸 Ảnh minh họa (tối đa 3, ít nhất 1)</label>
        <div class="inline-photos" id="editPhotosContainer">
          <div class="photo-box" onclick="triggerPhotoInput()">
            <span class="placeholder">+ Ảnh</span>
          </div>
        </div>
        <div class="photo-hint">⚡ Yêu cầu ít nhất 1 ảnh khi Không đạt</div>
      </div>

      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-blue" id="btnSaveEdit" onclick="saveEditForm()" style="flex:1;">💾 Lưu</button>
        <button class="btn btn-ghost" id="btnCancelEdit" onclick="cancelEdit()">Huỷ</button>
      </div>
    </div>
  </div>

</div>

<div class="submit-bar" id="submitBar">
  <button class="btn btn-ghost" id="btnSubmitNoChange" onclick="onNoChange()" style="flex:1;border-color:var(--green);color:var(--green);">✅ Không đổi</button>
  <button class="btn btn-primary" id="btnSubmitAll" onclick="submitAll()" style="flex:1;">💾 Lưu khảo sát</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzxPXoDhsPYDe7RbBBfGyW8shFxsB3Q6sv7SvxKSP31H9uKOvtGLSyoHRSRUj-jo3Mo/exec';
var STORELIST_CSV = 'https://docs.google.com/spreadsheets/d/1fMmEm1GC9aei_3oeu2vcadPVsUM9ms9eVhm99d7pF8A/gviz/tq?tqx=out:csv&gid=900581387';

// ===== DEFAULT 34 ITEMS =====
var DEFAULT_ITEMS = [
  {area:'TRƯỚC CH',name:'Biển hiệu WM+'},{area:'TRƯỚC CH',name:'Mặt tiền/ sơn tường ngoài'},{area:'TRƯỚC CH',name:'Cửa cuốn/ cửa kính'},{area:'TRƯỚC CH',name:'Mái hiên/ mái che'},{area:'TRƯỚC CH',name:'Đèn chiếu sáng ngoài'},{area:'TRƯỚC CH',name:'Vỉa hè'},{area:'TRƯỚC CH',name:'Biển quảng cáo/Poster'},{area:'TRƯỚC CH',name:'Cây xanh'},{area:'TRƯỚC CH',name:'Thùng rác ngoài'},{area:'TRƯỚC CH',name:'Camera an ninh ngoài'},
  {area:'TRONG CH',name:'Trần nhà/ thạch cao'},{area:'TRONG CH',name:'Tường'},{area:'TRONG CH',name:'Đèn chiếu sáng'},{area:'TRONG CH',name:'Điều hòa/ quạt/ thông gió'},{area:'TRONG CH',name:'Kệ trưng bày'},{area:'TRONG CH',name:'Tủ mát/ tủ đông/ tủ lạnh'},{area:'TRONG CH',name:'Bảng giá'},{area:'TRONG CH',name:'Giỏ hàng/ xe đẩy'},{area:'TRONG CH',name:'Quầy thu ngân'},{area:'TRONG CH',name:'Cân điện tử'},{area:'TRONG CH',name:'Wifi/ Mạng/ Thiết bị IT'},{area:'TRONG CH',name:'Hạng mục khác'},{area:'TRONG CH',name:'Hệ thống âm thanh'},{area:'TRONG CH',name:'Bình chữa cháy/ PCCC'},{area:'TRONG CH',name:'Ổ điện, hệ thống điện'},{area:'TRONG CH',name:'Camera an ninh trong'},
  {area:'KHO - NVS',name:'Cửa kho / cửa NVS'},{area:'KHO - NVS',name:'Kệ kho/ Palet'},{area:'KHO - NVS',name:'Sàn kho / NVS'},{area:'KHO - NVS',name:'Đường điện'},{area:'KHO - NVS',name:'Thiết bị vệ sinh'},{area:'KHO - NVS',name:'Đường nước'},{area:'KHO - NVS',name:'Thiết bị nhà vệ sinh'},{area:'KHO - NVS',name:'Sàn kho / NVS (tổng thể)'}
];

// ===== STATE =====
var cascadeData = {};
var storeList = [];
var itemList = [];         // current items for selected CH
var selectedStore = null;
var editingIdx = null;     // null=add, number=edit itemList[index]
var editEval = null;       // 'pass' or 'fail'
var editPhotos = [];       // photos in edit form
var isSubmitting = false;
var AREA_ORDER = ['TRƯỚC CH','TRONG CH','KHO - NVS'];
var AREA_ICONS = {'TRƯỚC CH':'🏪','TRONG CH':'🛒','KHO - NVS':'📦'};

// ===== TOAST =====
var _tt;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show');},2600);}

// ===== INIT =====
function init(){
  // Load checklist items (always use default 34)
  // Load storelist
  fetch(GAS_URL+'?action=storeData')
    .then(function(r){return r.ok?r.json():null;})
    .then(function(rows){
      if(rows&&rows.length){storeList=rows;buildCascade();}
    }).catch(function(){csvFallback();});
  setTimeout(function(){
    if(document.getElementById('selGdv').options.length<=1) csvFallback();
  },3000);
}

function csvFallback(){
  fetch(STORELIST_CSV).then(function(r){return r.text();}).then(function(t){
    var rows=parseCSV(t),arr=[];
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      if((r['Tình Trạng']||'').trim()!=='Đang hoạt động')continue;
      arr.push({gdv:r['GĐV']||'',qlkv:r['QLKV']||'',ma:r['Mã SAP']||'',ten:r['Tên cửa hàng']||'',tinh:r['Tỉnh/TP']||''});
    }
    if(arr.length){storeList=arr;buildCascade();}
  }).catch(function(){});
}

function parseCSV(t){
  var rows=[],row=[],cur='',iq=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(iq){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++;}else iq=false;}else cur+=c;}
    else if(c=='"')iq=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1)rows.push(row);row=[];}
    else cur+=c;
  }
  row.push(cur);if(row.length>1)rows.push(row);
  if(rows.length<2)return[];
  var h=rows[0].map(function(x){return x.trim();});
  return rows.slice(1).map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i];});return o;});
}

function buildCascade(){
  cascadeData={};
  for(var i=0;i<storeList.length;i++){
    var s=storeList[i],g=s.gdv||'Chưa PC',q=s.qlkv||'Chưa PC';
    if(!cascadeData[g])cascadeData[g]={};
    if(!cascadeData[g][q])cascadeData[g][q]=[];
    cascadeData[g][q].push(s);
  }
  var sel=document.getElementById('selGdv');
  var ks=Object.keys(cascadeData).sort();
  sel.innerHTML='<option value="">-- Chọn GĐV --</option>';
  for(var i=0;i<ks.length;i++){
    var g=ks[i];
    sel.innerHTML+='<option value="'+g+'">'+g+' ('+Object.keys(cascadeData[g]).length+' QLKV)</option>';
  }
}

// ===== CASCADE =====
document.getElementById('selGdv').addEventListener('change',function(){
  var g=this.value,qs=document.getElementById('selQlkv'),ss=document.getElementById('selCh');
  qs.innerHTML='<option value="">-- Chọn QLKV --</option>';
  ss.innerHTML='<option value="">-- Chọn CH --</option>';ss.disabled=true;
  hideStoreInfo();
  if(!g||!cascadeData[g]){qs.disabled=true;return;}
  qs.disabled=false;
  var qks=Object.keys(cascadeData[g]).sort();
  for(var i=0;i<qks.length;i++){var q=qks[i];qs.innerHTML+='<option value="'+q+'">'+q+' ('+cascadeData[g][q].length+' CH)</option>';}
});
document.getElementById('selQlkv').addEventListener('change',function(){
  var g=document.getElementById('selGdv').value,q=this.value,ss=document.getElementById('selCh');
  ss.innerHTML='<option value="">-- Chọn CH --</option>';hideStoreInfo();
  if(!g||!q||!cascadeData[g]||!cascadeData[g][q]){ss.disabled=true;return;}
  ss.disabled=false;
  var chs=cascadeData[g][q].sort(function(a,b){return (a.ma||'').localeCompare(b.ma||'');});
  for(var i=0;i<chs.length;i++){
    var c=chs[i];
    ss.innerHTML+='<option value="'+c.ma+'" data-name="'+c.ten+'" data-tinh="'+c.tinh+'">'+c.ma+' - '+c.ten+'</option>';
  }
});
document.getElementById('selCh').addEventListener('change',function(){
  var opt=this.selectedOptions[0];
  if(opt&&opt.getAttribute('data-name')){
    selectedStore={ma:opt.value,ten:opt.getAttribute('data-name'),tinh:opt.getAttribute('data-tinh')};
    document.getElementById('siMa').textContent=selectedStore.ma;
    document.getElementById('siTinh').textContent=selectedStore.tinh;
    document.getElementById('siTen').textContent=selectedStore.ten;
    document.getElementById('chInfo').style.display='block';
    loadItemsForCH();
  }else{
    selectedStore=null;hideStoreInfo();hideListCard();
  }
});

function hideStoreInfo(){
  document.getElementById('chInfo').style.display='none';
}

// ===== LOAD ITEMS: default 34 + merge last survey =====
function loadItemsForCH(){
  // Start with default 34 items
  itemList=DEFAULT_ITEMS.map(function(d,i){
    return {area:d.area,name:d.name,eval:null,note:'',photos:[],_custom:false,_changed:false,_hasHistory:false};
  });

  // Try load last survey
  fetch(GAS_URL+'?action=history&store='+encodeURIComponent(selectedStore.ma))
    .then(function(r){return r.ok?r.json():null;})
    .then(function(data){
      if(!data||!data.length||!data[0].items)return;
      var lastItems=data[0].items;
      for(var i=0;i<lastItems.length;i++){
        var li=lastItems[i],found=false;
        for(var j=0;j<itemList.length;j++){
          if(itemList[j].area===li.area&&itemList[j].name===li.item){
            itemList[j].eval=li.result==='Đạt'?'pass':'fail';
            itemList[j].note=li.note||'';itemList[j].photos=li.photos||[];
            itemList[j]._hasHistory=true;found=true;break;
          }
        }
        if(!found&&li._custom){
          itemList.push({area:li.area,name:li.item,eval:li.result==='Đạt'?'pass':'fail',note:li.note||'',photos:li.photos||[],_custom:true,_changed:false,_hasHistory:true});
        }
      }
    }).catch(function(){})
    .finally(function(){
      showListCard();
      renderList();
    });
}

// ===== SHOW/HIDE =====
function showListCard(){
  document.getElementById('listCard').style.display='block';
  document.getElementById('btnAddNew').disabled=false;
  document.getElementById('btnNoChange').disabled=false;
  document.getElementById('submitBar').classList.add('show');
}

function hideListCard(){
  document.getElementById('listCard').style.display='none';
  document.getElementById('btnAddNew').disabled=true;
  document.getElementById('btnNoChange').disabled=true;
  document.getElementById('submitBar').classList.remove('show');
  itemList=[];
}

// ===== RENDER LIST (grouped by area) =====
function renderList(){
  var groups=[];
  AREA_ORDER.forEach(function(a){
    var its=itemList.filter(function(e){return e.area===a;});
    if(its.length) groups.push({area:a,items:its});
  });
  
  var total=itemList.length,passCount=0,failCount=0;
  for(var i=0;i<itemList.length;i++){
    if(itemList[i].eval==='pass')passCount++;
    else if(itemList[i].eval==='fail')failCount++;
  }
  document.getElementById('tagCount').textContent=total+' mục · ✅'+passCount+' ❌'+failCount;
  
  var html='';
  for(var g=0;g<groups.length;g++){
    var grp=groups[g];
    html+='<div class="area-group">';
    html+='<div class="area-title">'+(AREA_ICONS[grp.area]||'')+' '+grp.area+' <span class="cnt">'+grp.items.length+' mục</span></div>';
    for(var i=0;i<grp.items.length;i++){
      var e=grp.items[i];
      var cls='',badge='',sub='';
      if(e.eval==='pass'){cls='pass';badge='<span class="badge pass">✅ Đạt</span>';sub='Tình trạng tốt';}
      else if(e.eval==='fail'){cls='fail';badge='<span class="badge fail">❌ Ko đạt</span>';sub=e.note?e.note.substring(0,80):'Không đạt';}
      else{badge='<span class="badge pending">⬜ Chưa</span>';sub='Click ✏️ để đánh giá';}
      if(e._custom)badge+=' <span class="badge new">MỚI</span>';
      if(e._changed&&!e._custom)badge+=' <span class="badge edited">đã sửa</span>';
      
      // Photos thumbnail
      var photoHtml='';
      if(e.photos&&e.photos.length){
        photoHtml='<div class="item-photos">';
        for(var p=0;p<Math.min(e.photos.length,3);p++){
          var src=typeof e.photos[p]==='string'?e.photos[p]:e.photos[p].dataUrl;
          photoHtml+='<img src="'+src+'">';
        }
        photoHtml+='</div>';
      }
      sub+=photoHtml;
      
      // Find global index
      var gi=-1;
      for(var k=0;k<itemList.length;k++){if(itemList[k]===e){gi=k;break;}}
      
      html+='<div class="item-card '+cls+(e._custom?' custom':'')+'">';
      html+='<div class="idx">'+(e._custom?'+':(gi+1))+'</div>';
      html+='<div class="body"><div class="t">'+e.name+badge+'</div><div class="s">'+sub+'</div></div>';
      html+='<div class="acts"><button class="act edit" onclick="toggleEditForm('+gi+')" title="Sửa">✏️</button></div>';
      html+='</div>';
    }
    html+='</div>';
  }
  
  document.getElementById('itemList').innerHTML=html||'<div class="item-card" style="justify-content:center;color:var(--muted);">Chưa có hạng mục nào</div>';
  
  // Update nút "Không thay đổi" vs "Lưu thay đổi"
  refreshNoChangeBtn();
}

function refreshNoChangeBtn(){
  var btn=document.getElementById('btnNoChange');
  var btnSubmit=document.getElementById('btnSubmitNoChange');
  if(!btn||!selectedStore)return;
  var changed=itemList.filter(function(e){return e._changed;});
  if(changed.length>0){
    btn.textContent='💾 Lưu thay đổi ('+changed.length+')';
    btn.style.borderColor='var(--red)';btn.style.color='var(--red)';
    if(btnSubmit){btnSubmit.textContent='💾 Lưu thay đổi ('+changed.length+')';btnSubmit.style.borderColor='var(--red)';btnSubmit.style.color='var(--red)';}
  }else{
    btn.textContent='✅ Không thay đổi';
    btn.style.borderColor='var(--green)';btn.style.color='var(--green)';
    if(btnSubmit){btnSubmit.textContent='✅ Không đổi';btnSubmit.style.borderColor='var(--green)';btnSubmit.style.color='var(--green)';}
  }
}

// ===== EDIT FORM =====
function toggleEditForm(idx){
  editingIdx=idx;
  var card=document.getElementById('editCard');
  
  if(idx===null){
    // Add new
    document.getElementById('formTitle').textContent='Thêm vấn đề mới';
    document.getElementById('editArea').value='';
    document.getElementById('editItemName').value='';
    editEval=null;editPhotos=[];
    document.getElementById('btnPass').classList.remove('sel');
    document.getElementById('btnFail').classList.remove('sel');
    document.getElementById('failDetail').classList.remove('show');
    document.getElementById('editNote').value='';
  }else{
    // Edit existing
    var e=itemList[idx];
    document.getElementById('formTitle').textContent='Sửa: '+e.name;
    document.getElementById('editArea').value=e.area;
    document.getElementById('editItemName').value=e.name;
    editEval=e.eval;
    editPhotos=(e.photos||[]).slice();
    document.getElementById('btnPass').classList.toggle('sel',e.eval==='pass');
    document.getElementById('btnFail').classList.toggle('sel',e.eval==='fail');
    if(e.eval==='fail'){
      document.getElementById('failDetail').classList.add('show');
      document.getElementById('editNote').value=e.note||'';
    }else{
      document.getElementById('failDetail').classList.remove('show');
      document.getElementById('editNote').value='';
    }
  }
  renderEditPhotos();
  card.classList.add('show');
  card.scrollIntoView({behavior:'smooth',block:'center'});
  refreshNoChangeBtn();
}

function setEditEval(value){
  editEval=value;
  document.getElementById('btnPass').classList.toggle('sel',value==='pass');
  document.getElementById('btnFail').classList.toggle('sel',value==='fail');
  document.getElementById('failDetail').classList.toggle('show',value==='fail');
  if(value!=='fail'){document.getElementById('editNote').value='';editPhotos=[];renderEditPhotos();}
}

function triggerPhotoInput(){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';inp.capture='environment';
  inp.onchange=function(){
    if(!inp.files||!inp.files[0])return;
    if(editPhotos.length>=3){toast('⚠️ Tối đa 3 ảnh');return;}
    var reader=new FileReader();
    reader.onload=function(ev){editPhotos.push({dataUrl:ev.target.result,name:inp.files[0].name});renderEditPhotos();};
    reader.readAsDataURL(inp.files[0]);
  };
  inp.click();
}

function removeEditPhoto(idx){
  editPhotos.splice(idx,1);renderEditPhotos();
}

function renderEditPhotos(){
  var c=document.getElementById('editPhotosContainer');
  var h='';
  for(var i=0;i<editPhotos.length;i++){
    var src=typeof editPhotos[i]==='string'?editPhotos[i]:editPhotos[i].dataUrl;
    h+='<div class="photo-box"><img src="'+src+'"><span class="remove" onclick="removeEditPhoto('+i+')">✕</span></div>';
  }
  if(editPhotos.length<3){
    h+='<div class="photo-box" onclick="triggerPhotoInput()"><span class="placeholder">+ Ảnh</span></div>';
  }
  c.innerHTML=h;
}

function saveEditForm(){
  var area=document.getElementById('editArea').value.trim();
  var name=document.getElementById('editItemName').value.trim();
  if(!area){toast('⚠️ Chọn khu vực');return;}
  if(!name){toast('⚠️ Nhập tên hạng mục');return;}
  if(!editEval){toast('⚠️ Chọn Đạt hoặc Ko đạt');return;}
  if(editEval==='fail'){
    var note=document.getElementById('editNote').value.trim();
    if(!note){toast('⚠️ Nhập diễn giải');return;}
    if(editPhotos.length===0){toast('⚠️ Cần ít nhất 1 ảnh');return;}
  }
  
  var data={area:area,name:name,eval:editEval,note:editEval==='fail'?document.getElementById('editNote').value.trim():'',photos:editEval==='fail'?editPhotos.slice():[]};
  
  if(editingIdx===null){
    data._custom=true;data._changed=true;data._hasHistory=false;
    itemList.push(data);
    toast('✅ Đã thêm: '+name);
  }else{
    var e=itemList[editingIdx];
    e.area=data.area;e.name=data.name;e.eval=data.eval;
    e.note=data.note;e.photos=data.photos;
    e._changed=true;
    toast('✅ Đã sửa: '+name);
  }
  
  cancelEdit();
  renderList();
}

function cancelEdit(){
  editingIdx=null;editEval=null;editPhotos=[];
  document.getElementById('editArea').value='';
  document.getElementById('editItemName').value='';
  document.getElementById('editNote').value='';
  document.getElementById('btnPass').classList.remove('sel');
  document.getElementById('btnFail').classList.remove('sel');
  document.getElementById('failDetail').classList.remove('show');
  document.getElementById('editCard').classList.remove('show');
  renderEditPhotos();
  refreshNoChangeBtn();
}

// ===== NO CHANGE / SAVE =====
function onNoChange(){
  if(!selectedStore){toast('⚠️ Chọn CH trước');return;}
  var changed=itemList.filter(function(e){return e._changed;});
  if(changed.length>0){submitAll();return;}
  confirmNoChange();
}

function confirmNoChange(){
  if(!selectedStore)return;
  if(isSubmitting)return;
  isSubmitting=true;
  var b1=document.getElementById('btnNoChange'),b2=document.getElementById('btnSubmitNoChange');
  b1.textContent='⏳ Đang lưu...';b1.disabled=true;
  if(b2){b2.textContent='⏳ Đang lưu...';b2.disabled=true;}
  
  var payload={action:'nochange',store:selectedStore.ma,storeName:selectedStore.ten,tinh:selectedStore.tinh,gdv:document.getElementById('selGdv').value,qlkv:document.getElementById('selQlkv').value,timestamp:new Date().toISOString()};
  var done=function(){showCompleted('không đổi');isSubmitting=false;};
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(){done();}).catch(function(){done();});
}

function submitAll(){
  if(!selectedStore){toast('⚠️ Chọn CH trước');return;}
  if(isSubmitting)return;
  
  var ue=itemList.filter(function(e){return!e.eval;});
  if(ue.length>0){toast('⚠️ Còn '+ue.length+' mục chưa đánh giá!');return;}
  var fn=itemList.filter(function(e){return e.eval==='fail'&&(!e.note||!e.note.trim());});
  if(fn.length>0){toast('⚠️ '+fn.length+' mục Ko đạt chưa có diễn giải!');return;}
  var fp=itemList.filter(function(e){return e.eval==='fail'&&(!e.photos||e.photos.length===0);});
  if(fp.length>0){toast('⚠️ '+fp.length+' mục Ko đạt chưa có ảnh!');return;}
  
  isSubmitting=true;
  var b1=document.getElementById('btnSubmitAll');
  b1.textContent='⏳ Đang lưu...';b1.disabled=true;
  var b2=document.getElementById('btnNoChange'),b3=document.getElementById('btnSubmitNoChange');
  if(b2)b2.disabled=true;if(b3)b3.disabled=true;
  
  var pc=0,fc=0,items=[];
  for(var i=0;i<itemList.length;i++){
    var e=itemList[i];
    if(e.eval==='pass')pc++;else if(e.eval==='fail')fc++;
    items.push({area:e.area,item:e.name,result:e.eval==='pass'?'Đạt':'Không đạt',note:e.eval==='pass'?'Đạt':(e.note||''),photos:e.photos||[],_custom:e._custom});
  }
  
  var payload={store:selectedStore.ma,storeName:selectedStore.ten,tinh:selectedStore.tinh,gdv:document.getElementById('selGdv').value,qlkv:document.getElementById('selQlkv').value,items:items,totalItems:itemList.length,passCount:pc,failCount:fc};
  
  var done=function(rs){isSubmitting=false;showCompleted('đã cập nhật',rs);};
  
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(res){done(res.rowsSaved);})
    .catch(function(){toast('⚠️ Lỗi kết nối, đã lưu tạm');done(0);});
}

function showCompleted(tt,rs){
  var old=document.getElementById('completedBox');if(old)old.remove();
  var pc=0,fc=0;
  for(var i=0;i<itemList.length;i++){if(itemList[i].eval==='pass')pc++;else if(itemList[i].eval==='fail')fc++;}
  
  var box=document.createElement('div');
  box.id='completedBox';box.className='completed-box';
  box.innerHTML=
    '<div class="icon">✅</div>'+
    '<div class="title">Đã hoàn thành khảo sát!</div>'+
    '<div class="store-name">'+selectedStore.ma+' — '+selectedStore.ten+'</div>'+
    '<div class="summary">✅ '+pc+' Đạt · ❌ '+fc+' Ko đạt · '+itemList.length+' mục'+(rs?' · '+rs+' dòng đã lưu':'')+'</div>'+
    '<div style="margin-top:10px"><button class="btn btn-blue" onclick="doNewSurvey()" style="font-size:13px;">🔍 Khảo sát cửa hàng khác</button></div>';
  
  document.getElementById('itemList').appendChild(box);
  box.scrollIntoView({behavior:'smooth',block:'center'});
  document.getElementById('submitBar').classList.remove('show');
}

function doNewSurvey(){
  var box=document.getElementById('completedBox');if(box)box.remove();
  document.getElementById('selGdv').value='';
  document.getElementById('selQlkv').innerHTML='<option value="">-- Chọn QLKV --</option>';
  document.getElementById('selQlkv').disabled=true;
  document.getElementById('selCh').innerHTML='<option value="">-- Chọn CH --</option>';
  document.getElementById('selCh').disabled=true;
  hideStoreInfo();hideListCard();
  selectedStore=null;itemList=[];isSubmitting=false;editingIdx=null;
  cancelEdit();
  window.scrollTo({top:0,behavior:'smooth'});
}

init();
</script>
