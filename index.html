<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Khảo sát CSVC · WinMart+ Rural</title>
<style>
:root{--red:#d71920;--blue:#1a3c6e;--green:#16a34a;--gold:#f59e0b;--bg:#f4f5f7;--card:#fff;--txt:#1f2937;--muted:#6b7280;--border:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',-apple-system,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;padding-bottom:100px}
.topbar{background:linear-gradient(135deg,var(--red),#0f2b50);color:#fff;padding:10px 14px}
.topbar .t{font-size:16px;font-weight:800}.topbar .v{font-size:11px;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:20px;margin-left:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-top:12px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:700;font-size:15px;border-bottom:1px solid var(--border)}
.card-head .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex-shrink:0}
.card-head .tag{margin-left:auto;font-size:11px;background:#eef2f7;padding:3px 8px;border-radius:20px;color:var(--muted)}
.card-body{padding:14px 16px}
label{display:block;font-size:12px;font-weight:600;color:#374151;margin:8px 0 3px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,60,110,.12)}
textarea{min-height:50px;resize:vertical;font-size:12px}
select:disabled{background:#f1f5f9;color:#94a3b8}
.row{display:flex;gap:8px}.row>div{flex:1;min-width:0}

.store-info{background:#f0fdf4;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12px;display:none}

/* State banners */
.state-banner{padding:14px 16px;border-radius:10px;margin-bottom:8px;font-size:14px;font-weight:600;line-height:1.5}
.state-banner.has-issues{background:#fef3c7;border:1px solid #fde68a;color:#92400e}
.state-banner.no-issues{background:#dbeafe;border:1px solid #bfdbfe;color:#1e40af}

/* Issue card */
.issue-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:8px;background:#fafbfc}
.issue-card .ihd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.issue-card .ihd .name{font-weight:700;font-size:14px;flex:1}
.issue-card .ihd .status{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px}
.issue-card .ihd .status.open{background:#fef2f2;color:#dc2626}
.issue-card .ihd .status.done{background:#dcfce7;color:#16a34a}
.issue-card .timeline{font-size:11px;color:var(--muted);margin-bottom:6px}
.issue-card .timeline .tl-item{display:flex;gap:8px;padding:2px 0}
.issue-card .timeline .tl-date{color:#94a3b8;white-space:nowrap;min-width:70px}
.issue-card .timeline .tl-action{font-weight:500}
.issue-card .timeline .tl-note{color:var(--muted);font-style:italic}
.issue-card .note{font-size:12px;color:var(--muted);margin-top:4px;padding:6px 8px;background:#f8fafc;border-radius:6px}
.issue-card .photos{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}.issue-card .photos img{width:42px;height:42px;border-radius:4px;object-fit:cover;border:1px solid var(--border)}
.issue-card .acts{margin-top:8px;text-align:right}

.btn{display:inline-flex;align-items:center;gap:4px;padding:10px 16px;border-radius:9px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-block{width:100%;margin-top:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.edit-card{display:none;margin-top:12px}
.edit-card.show{display:block}

.edit-eval{display:flex;gap:10px}
.edit-eval .evb{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border:2px solid transparent;text-align:center}
.edit-eval .evb.pass{background:#f0fdf4;color:var(--green)}.edit-eval .evb.pass.sel{border-color:var(--green);background:#dcfce7}
.edit-eval .evb.fail{background:#fef2f2;color:var(--red)}.edit-eval .evb.fail.sel{border-color:var(--red);background:#fee2e2}

.fail-box{display:none;margin-top:10px;padding:10px;background:#fff5f5;border-radius:8px;border:1px dashed #fca5a5}
.fail-box.show{display:block}
.fail-box label{font-size:11px;color:#b91c1c}

.photos-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.pbox{width:52px;height:52px;border:2px dashed #cbd5e1;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;flex-shrink:0}
.pbox img{width:100%;height:100%;object-fit:cover}
.pbox .x{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.6);color:#fff;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:8px}
.pbox .ph{font-size:8px;color:#94a3b8;text-align:center}
.pbox:hover{border-color:var(--red)}

.fab{position:fixed;right:16px;bottom:100px;z-index:90}
.fab .btn{width:50px;height:50px;border-radius:50%;font-size:22px;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar">
  <div class="t-row" style="display:flex;align-items:center;justify-content:space-between">
    <div><span class="t">🏪 Khảo sát CSVC</span><span class="v">v10</span></div>
  </div>
</div>
<div class="wrap">
  <!-- ① CH -->
  <div class="card">
    <div class="card-head"><span class="dot"></span>① Cửa hàng</div>
    <div class="card-body">
      <div class="row">
        <div><label>GĐV</label><select id="sg"><option>-- Đang tải --</option></select></div>
        <div><label>QLKV</label><select id="sq" disabled><option>-- Chọn QLKV --</option></select></div>
      </div>
      <label>Cửa hàng</label>
      <select id="sc" disabled><option>-- Chọn CH --</option></select>
      <div class="store-info" id="si">Mã: <b id="sMa">-</b> · Tỉnh: <b id="sTinh">-</b> · <b id="sTen">-</b></div>
    </div>
  </div>

  <!-- ② Issues -->
  <div class="card" id="listCard" style="display:none">
    <div class="card-head"><span class="dot"></span>② Tình trạng</div>
    <div class="card-body" id="issueArea"></div>
  </div>

  <!-- ③ Edit -->
  <div class="card edit-card" id="editCard">
    <div class="card-head"><span class="dot" style="background:var(--gold)"></span>③ <span id="efTitle">Khai báo / Cập nhật vấn đề</span></div>
    <div class="card-body">
      <div class="row">
        <div style="flex:0 0 38%"><label>Khu vực</label>
          <select id="ea" onchange="onAreaChange()"><option value="">-- Chọn --</option><option>TRƯỚC CH</option><option>TRONG CH</option><option>KHO - NVS</option></select></div>
        <div style="flex:1"><label>Tên hạng mục</label>
          <select id="en" onchange="onItemChange()"><option value="">-- Chọn hạng mục --</option></select>
          <input type="text" id="enCustom" placeholder="Nhập tên hạng mục mới..." style="display:none;margin-top:4px">
        </div>
      </div>
      <label>Tình trạng hiện tại</label>
      <div class="edit-eval" id="editEvalRow">
        <div class="evb pass" id="evPass" onclick="setEv('pass')">✅ Đã xử lý / Đạt</div>
        <div class="evb fail sel" id="evFail" onclick="setEv('fail')">❌ Chưa xử lý / Ko đạt</div>
      </div>
      <div class="fail-box show" id="failBox">
        <div class="row">
          <div><label>📅 Ngày phát sinh <span class="req-star">*</span></label><input type="date" id="eDate" max="" onchange="validateDates()"></div>
          <div><label>📞 Đã báo SU chưa? <span class="req-star">*</span></label><select id="eSU" onchange="toggleSUDate()"><option value="">-- Chọn --</option><option value="yes">✅ Đã báo</option><option value="no">❌ Chưa báo</option></select></div>
        </div>
        <div id="suDateRow" style="display:none"><label>📅 Ngày báo SU gần nhất <span class="req-star">*</span></label><input type="date" id="eSUDate" max="" onchange="validateDates()"><div class="hint" style="font-size:10px;color:var(--muted)">Phải sau ngày phát sinh</div></div>
        <label>📝 Diễn giải <span class="req-star">*</span></label><textarea id="enote" placeholder="Mô tả tình trạng..."></textarea>
        <label>📸 Ảnh (tối đa 3, ít nhất 1)</label>
        <div class="photos-row" id="ephotos"></div>
        <div class="photo-hint" style="font-size:10px;color:var(--red)">⚡ Yêu cầu ít nhất 1 ảnh</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-blue" onclick="saveEdit()" style="flex:1">💾 Lưu</button>
        <button class="btn btn-ghost" onclick="cancelEdit()">Huỷ</button>
      </div>
    </div>
  </div>
</div>

<div class="fab" id="fabAdd" style="display:none">
  <button class="btn btn-red" onclick="openAdd()">+</button>
</div>

<div class="toast" id="toast"></div>

<script>
var GAS='https://script.google.com/macros/s/AKfycbzxPXoDhsPYDe7RbBBfGyW8shFxsB3Q6sv7SvxKSP31H9uKOvtGLSyoHRSRUj-jo3Mo/exec';
var CSV='https://docs.google.com/spreadsheets/d/1fMmEm1GC9aei_3oeu2vcadPVsUM9ms9eVhm99d7pF8A/gviz/tq?tqx=out:csv&gid=900581387';
var cascade={},stores=[],issues=[],sel=null,edI=null,ev=null,eps=[],submitting=false,tt;
// 34 default items by area
var DEFAULT_ITEMS={
  'TRƯỚC CH':['Biển hiệu WM+','Mặt tiền/ sơn tường ngoài','Cửa cuốn/ cửa kính','Mái hiên/ mái che','Đèn chiếu sáng ngoài','Vỉa hè','Biển quảng cáo/Poster','Cây xanh','Thùng rác ngoài','Camera an ninh ngoài'],
  'TRONG CH':['Trần nhà/ thạch cao','Tường','Đèn chiếu sáng','Điều hòa/ quạt/ thông gió','Kệ trưng bày','Tủ mát/ tủ đông/ tủ lạnh','Bảng giá','Giỏ hàng/ xe đẩy','Quầy thu ngân','Cân điện tử','Wifi/ Mạng/ Thiết bị IT','Hạng mục khác','Hệ thống âm thanh','Bình chữa cháy/ PCCC','Ổ điện, hệ thống điện','Camera an ninh trong'],
  'KHO - NVS':['Cửa kho / cửa NVS','Kệ kho/ Palet','Sàn kho / NVS','Đường điện','Thiết bị vệ sinh','Đường nước','Thiết bị nhà vệ sinh','Sàn kho / NVS (tổng thể)']
};

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},2600)}

// ─── INIT ───
(function(){
  fetch(GAS+'?action=storeData').then(function(r){return r.ok?r.json():null}).then(function(rows){
    if(rows&&rows.length){stores=rows;buildC();}
  }).catch(function(){csvF();});
  setTimeout(function(){if(document.getElementById('sg').options.length<=1)csvF();},3000);
})();

function csvF(){
  fetch(CSV).then(function(r){return r.text()}).then(function(t){
    var rows=pCSV(t),arr=[];
    for(var i=0;i<rows.length;i++){var r=rows[i];if((r['Tình Trạng']||'').trim()!=='Đang hoạt động')continue;arr.push({gdv:r['GĐV']||'',qlkv:r['QLKV']||'',ma:r['Mã SAP']||'',ten:r['Tên cửa hàng']||'',tinh:r['Tỉnh/TP']||''})}
    if(arr.length){stores=arr;buildC();}
  }).catch(function(){});
}
function pCSV(t){var rows=[],row=[],cur='',iq=false;for(var i=0;i<t.length;i++){var c=t[i];if(iq){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++}else iq=false}else cur+=c}else if(c=='"')iq=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}else cur+=c}row.push(cur);rows.push(row);if(rows.length<2)return[];var h=rows[0].map(function(x){return x.trim()});return rows.slice(1).map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i]});return o})}
function buildC(){
  cascade={};for(var i=0;i<stores.length;i++){var s=stores[i],g=s.gdv||'CPC',q=s.qlkv||'CPC';if(!cascade[g])cascade[g]={};if(!cascade[g][q])cascade[g][q]=[];cascade[g][q].push(s)}
  var se=document.getElementById('sg'),ks=Object.keys(cascade).sort();se.innerHTML='<option value="">-- Chọn GĐV --</option>';
  for(var i=0;i<ks.length;i++){var g=ks[i];se.innerHTML+='<option value="'+g+'">'+g+' ('+Object.keys(cascade[g]).length+' QLKV)</option>'}
}

// ─── CASCADE ───
document.getElementById('sg').addEventListener('change',function(){
  var g=this.value;document.getElementById('sq').innerHTML='<option value="">-- Chọn QLKV --</option>';document.getElementById('sc').innerHTML='<option>-- Chọn CH --</option>';document.getElementById('sc').disabled=true;document.getElementById('si').style.display='none';
  if(!g||!cascade[g]){document.getElementById('sq').disabled=true;return}document.getElementById('sq').disabled=false;
  var ks=Object.keys(cascade[g]).sort();for(var i=0;i<ks.length;i++){var q=ks[i];document.getElementById('sq').innerHTML+='<option value="'+q+'">'+q+' ('+cascade[g][q].length+' CH)</option>'}
});
document.getElementById('sq').addEventListener('change',function(){
  var g=document.getElementById('sg').value,q=this.value,ss=document.getElementById('sc');ss.innerHTML='<option value="">-- Chọn CH --</option>';document.getElementById('si').style.display='none';
  if(!g||!q||!cascade[g]||!cascade[g][q]){ss.disabled=true;return}ss.disabled=false;
  var chs=cascade[g][q].sort(function(a,b){return(a.ma||'').localeCompare(b.ma||'')});for(var i=0;i<chs.length;i++){var c=chs[i];ss.innerHTML+='<option value="'+c.ma+'" data-name="'+c.ten+'" data-tinh="'+c.tinh+'">'+c.ma+' - '+c.ten+'</option>'}
});
document.getElementById('sc').addEventListener('change',function(){
  var o=this.selectedOptions[0];
  if(o&&o.getAttribute('data-name')){
    sel={ma:o.value,ten:o.getAttribute('data-name'),tinh:o.getAttribute('data-tinh')};
    document.getElementById('sMa').textContent=sel.ma;document.getElementById('sTinh').textContent=sel.tinh;document.getElementById('sTen').textContent=sel.ten;document.getElementById('si').style.display='block';
    loadIssues();
  }else{sel=null;document.getElementById('si').style.display='none';hideList()}
});

// ─── LOAD ISSUES ───
function loadIssues(){
  showList();
  document.getElementById('issueArea').innerHTML='<div style="text-align:center;color:var(--muted);padding:20px">Đang tải dữ liệu...</div>';
  
  fetch(GAS+'?action=history&store='+encodeURIComponent(sel.ma))
    .then(function(r){return r.ok?r.json():null})
    .then(function(data){
      if(data&&data.length&&data[0].items){
        // Get last survey items
        var lastItems=data[0].items;
        // Only show items that are "Không đạt" (actual issues)
        issues=lastItems.filter(function(it){return it.result==='Không đạt'}).map(function(it,i){
          return{area:it.area||'',name:it.item||'',note:it.note||'',photos:it.photos||[],date:data[0].date||'',_orig:it,_changed:false};
        });
        // Build timeline from all submissions
        buildTimeline(data,issues);
      }else{issues=[]}
    }).catch(function(){issues=[]})
    .finally(function(){renderIssues()});
}

function buildTimeline(allData,issueList){
  // For each issue, find all previous submissions
  for(var i=0;i<issueList.length;i++){
    var iss=issueList[i],tl=[];
    for(var d=0;d<Math.min(allData.length,10);d++){
      var sub=allData[d],its=sub.items||[];
      for(var j=0;j<its.length;j++){
        if(its[j].area===iss.area&&its[j].item===iss.name){
          tl.push({date:sub.date||'',result:its[j].result,note:its[j].note||''});
          break;
        }
      }
    }
    iss._timeline=tl;
  }
}

function renderIssues(){
  var area=document.getElementById('issueArea'),html='';
  
  if(!sel){area.innerHTML='';return}
  
  if(issues.length===0){
    html='<div class="state-banner no-issues">✅ Cửa hàng không có vấn đề Xây dựng - Setup được theo dõi.<br><span style="font-weight:400;font-size:13px">Hãy khai báo vấn đề nếu có →</span></div>';
  }else{
    html='<div class="state-banner has-issues">⚠️ Cửa hàng có <b>'+issues.length+' vấn đề</b>, vui lòng cập nhật tình trạng mới nhất.</div>';
    
    for(var i=0;i<issues.length;i++){
      var iss=issues[i],tl=iss._timeline||[];
      html+='<div class="issue-card">';
      html+='<div class="ihd"><span class="name">'+iss.name+'</span><span class="status open">❌ Chưa xử lý</span></div>';
      
      // Timeline
      if(tl.length>0){
        html+='<div class="timeline">';
        var first=tl[tl.length-1]; // oldest
        html+='<div class="tl-item"><span class="tl-date">'+fmtDate(first.date)+'</span><span class="tl-action">📋 Khai báo</span></div>';
        for(var t=tl.length-2;t>=0;t--){
          html+='<div class="tl-item"><span class="tl-date">'+fmtDate(tl[t].date)+'</span><span class="tl-action">🔄 Cập nhật: '+(tl[t].result==='Đạt'?'✅ Đã xử lý':'❌ Chưa xử lý')+'</span>'+(tl[t].note?' <span class="tl-note">— '+tl[t].note.substring(0,40)+'</span>':'')+'</div>';
        }
        html+='</div>';
      }
      
      // Note + photos
      if(iss.note)html+='<div class="note">'+iss.note+'</div>';
      if(iss.photos&&iss.photos.length){
        html+='<div class="photos">';
        for(var p=0;p<Math.min(iss.photos.length,4);p++){var src=typeof iss.photos[p]==='string'?iss.photos[p]:iss.photos[p].dataUrl;html+='<img src="'+src+'">'}
        html+='</div>';
      }
      
      html+='<div class="acts"><button class="btn btn-sm btn-blue" onclick="editIssue('+i+')">✏️ Cập nhật</button></div>';
      html+='</div>';
    }
  }
  
  // Add button
  html+='<button class="btn btn-ghost btn-block" onclick="openAdd()">➕ Khai báo vấn đề mới</button>';
  
  area.innerHTML=html;
  document.getElementById('fabAdd').style.display='block';
}

function fmtDate(d){
  if(!d)return'';
  var m=d.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return m[1]+'/'+m[2];
  m=d.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m)return m[3]+'/'+m[2];
  return d.substring(0,10);
}

function showList(){
  document.getElementById('listCard').style.display='block';
  document.getElementById('fabAdd').style.display='block';
}
function hideList(){
  document.getElementById('listCard').style.display='none';
  document.getElementById('fabAdd').style.display='none';
  issues=[];document.getElementById('issueArea').innerHTML='';
}

// ─── EDIT ───
function openAdd(){
  edI=null;
  // Set max date = today
  var today=new Date().toISOString().split('T')[0];
  document.getElementById('eDate').max=today;
  document.getElementById('eSUDate').max=today;
  showEditForm('Khai báo vấn đề mới','',null,null,[],'','','');
}
function editIssue(i){edI=i;var iss=issues[i];
  var today=new Date().toISOString().split('T')[0];
  document.getElementById('eDate').max=today;
  document.getElementById('eSUDate').max=today;
  showEditForm('Cập nhật: '+iss.name,iss.area,iss.name,iss.eval||'fail',(iss.photos||[]).slice(),iss.note||'',iss._date||'',iss._su||'',iss._sudate||'');
}

// Area change → update item dropdown
function onAreaChange(){
  var a=document.getElementById('ea').value,sel=document.getElementById('en');
  sel.innerHTML='<option value="">-- Chọn hạng mục --</option>';
  if(a&&DEFAULT_ITEMS[a]){
    var its=DEFAULT_ITEMS[a];
    for(var i=0;i<its.length;i++){sel.innerHTML+='<option value="'+its[i]+'">'+its[i]+'</option>'}
  }
  sel.innerHTML+='<option value="__custom__">(+) Thêm mới...</option>';
  sel.value='';document.getElementById('enCustom').style.display='none';document.getElementById('enCustom').value='';
}

function onItemChange(){
  var v=document.getElementById('en').value,ci=document.getElementById('enCustom');
  if(v==='__custom__'){ci.style.display='block';ci.focus()}else{ci.style.display='none';ci.value=''}
}

function getItemName(){
  var sel=document.getElementById('en');
  if(sel.value==='__custom__')return document.getElementById('enCustom').value.trim();
  return sel.value;
}

function showEditForm(title,area,name,ieval,photos,note,date,su,sudate){
  document.getElementById('efTitle').textContent=title;
  document.getElementById('ea').value=area;
  onAreaChange();
  
  var sel=document.getElementById('en'),ci=document.getElementById('enCustom');
  if(name&&area&&DEFAULT_ITEMS[area]&&DEFAULT_ITEMS[area].indexOf(name)>=0){
    sel.value=name;ci.style.display='none';
  }else if(name){
    sel.value='__custom__';ci.style.display='block';ci.value=name;
  }else{
    sel.value='';ci.style.display='none';
  }

  var isNew=(edI===null);
  
  // For NEW issues: always "Ko đạt", show date/SU fields
  // For UPDATE: show Đạt/Ko đạt toggle, hide date/SU
  if(isNew){
    ev='fail';
    document.getElementById('editEvalRow').style.display='none';
    document.getElementById('failBox').classList.add('show');
    document.getElementById('eDate').value=date||'';
    document.getElementById('eSU').value=su||'';
    toggleSUDate();
    document.getElementById('eSUDate').value=sudate||'';
  }else{
    ev=ieval||'fail';
    document.getElementById('editEvalRow').style.display='flex';
    document.getElementById('failBox').classList.toggle('show',ev==='fail');
    document.getElementById('eDate').value=date||'';
    document.getElementById('eSU').value=su||'';
    toggleSUDate();
    document.getElementById('eSUDate').value=sudate||'';
  }
  
  document.getElementById('evPass').classList.toggle('sel',ev==='pass');
  document.getElementById('evFail').classList.toggle('sel',ev==='fail');
  eps=photos||[];
  if(ev==='fail'){document.getElementById('enote').value=note||''}else{document.getElementById('enote').value=''}
  rPhotos();
  document.getElementById('editCard').classList.add('show');
  document.getElementById('editCard').scrollIntoView({behavior:'smooth',block:'center'});
}

function setEv(v){ev=v;document.getElementById('evPass').classList.toggle('sel',v==='pass');document.getElementById('evFail').classList.toggle('sel',v==='fail');document.getElementById('failBox').classList.toggle('show',v==='fail');if(v!=='fail'){eps=[];rPhotos();document.getElementById('enote').value='';document.getElementById('eDate').value='';document.getElementById('eSU').value='';document.getElementById('eSUDate').value=''}}

function toggleSUDate(){
  document.getElementById('suDateRow').style.display=document.getElementById('eSU').value==='yes'?'block':'none';
}
function validateDates(){
  var d=document.getElementById('eDate').value,sd=document.getElementById('eSUDate').value;
  if(d&&sd&&sd<d){toast('⚠️ Ngày báo SU phải sau ngày phát sinh');document.getElementById('eSUDate').value=''}
}

function tPhoto(){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
  inp.onchange=function(){if(!inp.files||!inp.files[0])return;if(eps.length>=3){toast('⚠️ Tối đa 3 ảnh');return}var r=new FileReader();r.onload=function(evt){eps.push({dataUrl:evt.target.result,name:inp.files[0].name});rPhotos()};r.readAsDataURL(inp.files[0])};
  inp.click();
}
function rp(i){eps.splice(i,1);rPhotos()}
function rPhotos(){var c=document.getElementById('ephotos'),h='';for(var i=0;i<eps.length;i++){var s=typeof eps[i]==='string'?eps[i]:eps[i].dataUrl;h+='<div class="pbox"><img src="'+s+'"><span class="x" onclick="rp('+i+')">✕</span></div>'}if(eps.length<3)h+='<div class="pbox" onclick="tPhoto()"><span class="ph">+ Ảnh</span></div>';c.innerHTML=h}

function saveEdit(){
  var a=document.getElementById('ea').value.trim(),n=getItemName(),isNew=(edI===null);
  if(!a){toast('⚠️ Chọn khu vực');return}
  if(!n){toast('⚠️ Chọn hoặc nhập tên hạng mục');return}
  if(!ev){toast('⚠️ Chọn tình trạng');return}
  
  if(ev==='fail'){
    var nt=document.getElementById('enote').value.trim();
    if(!nt){toast('⚠️ Nhập diễn giải');return}
    if(eps.length===0){toast('⚠️ Cần ít nhất 1 ảnh');return}
    var date=document.getElementById('eDate').value,su=document.getElementById('eSU').value,sudate=document.getElementById('eSUDate').value;
    if(isNew){
      if(!date){toast('⚠️ Chọn ngày phát sinh');return}
      if(!su){toast('⚠️ Chọn Đã báo SU chưa?');return}
      if(su==='yes'&&!sudate){toast('⚠️ Nhập ngày báo SU');return}
    }
  }
  
  var d={area:a,name:n,eval:ev,note:ev==='fail'?nt:'',photos:ev==='fail'?eps.slice():[],_changed:true,_date:date||'',_su:su||'',_sudate:sudate||''};
  if(edI===null){d._new=true;issues.unshift(d);toast('✅ Đã khai báo: '+n)}
  else{var iss=issues[edI];Object.assign(iss,d);toast('✅ Đã cập nhật: '+n)}
  
  // If marked as "Đạt", remove from issues list
  if(ev==='pass'&&edI!==null&&!d._new){
    submitAndRemove(edI);
  }else{
    cancelEdit();renderIssues();
    autoSave();
  }
}

function submitAndRemove(i){
  if(submitting)return;submitting=true;
  var its=issues.map(function(e){return{area:e.area,item:e.name,result:e.eval==='pass'?'Đạt':'Không đạt',note:e.note||'',photos:e.photos||[],date:e._date||'',su:e._su||'',sudate:e._sudate||''}});
  var p={store:sel.ma,storeName:sel.ten,tinh:sel.tinh,gdv:document.getElementById('sg').value,qlkv:document.getElementById('sq').value,items:its,totalItems:its.length,passCount:1,failCount:its.length-1};
  fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
    .then(function(r){return r.json()}).then(function(){
      issues.splice(i,1);cancelEdit();renderIssues();submitting=false;
      toast('✅ Đã lưu — vấn đề được đánh dấu Đã xử lý');
    }).catch(function(){submitting=false;cancelEdit();renderIssues()});
}

function autoSave(){
  if(submitting)return;submitting=true;
  var its=issues.map(function(e){return{area:e.area,item:e.name,result:e.eval==='pass'?'Đạt':'Không đạt',note:e.note||'',photos:e.photos||[],date:e._date||'',su:e._su||'',sudate:e._sudate||''}});
  var p={store:sel.ma,storeName:sel.ten,tinh:sel.tinh,gdv:document.getElementById('sg').value,qlkv:document.getElementById('sq').value,items:its,totalItems:its.length,passCount:0,failCount:its.length};
  fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
    .then(function(r){return r.json()}).catch(function(){})
    .finally(function(){submitting=false});
}

function cancelEdit(){
  edI=null;ev='fail';eps=[];document.getElementById('ea').value='';document.getElementById('en').value='';document.getElementById('enCustom').value='';document.getElementById('enCustom').style.display='none';document.getElementById('enote').value='';document.getElementById('eDate').value='';document.getElementById('eSU').value='';document.getElementById('eSUDate').value='';document.getElementById('suDateRow').style.display='none';document.getElementById('evPass').classList.remove('sel');document.getElementById('evFail').classList.add('sel');document.getElementById('failBox').classList.add('show');document.getElementById('editEvalRow').style.display='flex';document.getElementById('editCard').classList.remove('show');rPhotos()
}
</script>
</body>
</html>
