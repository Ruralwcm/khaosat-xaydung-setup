<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Khảo sát vấn đề Setup - Xây dựng v6.0</title>
<style>
:root{
  --red:#d71920;--blue:#1a3c6e;--green:#16a34a;--gold:#f59e0b;
  --bg:#f4f5f7;--card:#ffffff;--txt:#1f2937;--muted:#6b7280;--border:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Be Vietnam Pro','Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--txt);line-height:1.5;padding-bottom:100px;
}
.topbar{background:linear-gradient(135deg,var(--red),#0f2b50);color:#fff;padding:12px 14px;}
.topbar .t-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.topbar .t-title{font-size:16px;font-weight:800;line-height:1.2;}
.topbar .t-title .vbadge{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);color:#fff;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;}
.topbar .t-sub{font-size:11px;opacity:.85;margin-top:1px;}

.wrap{max-width:640px;margin:0 auto;padding:0 12px;}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-top:12px;overflow:hidden;}
.card-head{display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:700;font-size:15px;border-bottom:1px solid var(--border);}
.card-head .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex-shrink:0;}
.card-head .tag{margin-left:auto;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:#eef2f7;color:var(--muted);white-space:nowrap;}
.card-body{padding:14px 16px;}

label{display:block;font-size:12px;font-weight:600;color:#374151;margin:8px 0 3px;}
label:first-child{margin-top:0;}
label .req-star{color:var(--red);}
input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;
  font-size:14px;font-family:inherit;background:#fff;color:var(--txt);
  transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,60,110,.12);}
textarea{min-height:50px;resize:vertical;font-size:13px;}
.row{display:flex;gap:8px;}
.row > div{flex:1;min-width:0;}

/* progress bar */
.progress-wrap{margin:12px 0 8px;display:none;}
.progress-wrap.show{display:block;}
.progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.progress-label{font-size:12px;font-weight:700;color:var(--muted);}
.progress-count{font-size:14px;font-weight:800;color:var(--blue);}
.progress-bar{background:#e2e8f0;border-radius:6px;height:8px;overflow:hidden;}
.progress-fill{background:linear-gradient(90deg,var(--red),var(--green));height:100%;border-radius:6px;transition:width .3s;}

/* area tabs */
.area-tabs{display:flex;gap:4px;margin:10px 0;flex-wrap:wrap;}
.area-tab{padding:4px 12px;border-radius:14px;font-size:11px;font-weight:600;background:#e2e8f0;color:var(--muted);border:none;cursor:pointer;transition:all .2s;font-family:inherit;}
.area-tab.active{background:var(--red);color:#fff;}
.area-tab .cnt{opacity:.6;font-size:10px;}

/* item list */
.item-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:6px;display:flex;align-items:flex-start;gap:10px;background:#fafbfc;cursor:pointer;transition:all .15s;}
.item-card:hover{background:#f0fdf4;border-color:#86efac;}
.item-card.eval-pass{background:#f0fdf4;border-color:#bbf7d0;}
.item-card.eval-fail{background:#fef2f2;border-color:#fecaca;}
.item-card.eval-pass .idx{background:var(--green);}
.item-card.eval-fail .idx{background:var(--red);}
.item-card .idx{background:var(--blue);color:#fff;border-radius:50%;width:26px;height:26px;min-width:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px;}
.item-card .body{flex:1;min-width:0;}
.item-card .t{font-size:14px;font-weight:700;}
.item-card .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.item-card .badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;display:inline-block;margin-left:6px;}
.item-card .badge.pass{background:#dcfce7;color:#16a34a;}
.item-card .badge.fail{background:#fef2f2;color:#dc2626;}
.item-card .badge.pend{background:#eef2f7;color:var(--muted);}
.item-card .badge.new{background:#fef3c7;color:#92400e;}

/* edit row (expand) */
.edit-row{display:none;margin-top:8px;padding:10px 12px;background:#f8fafc;border-radius:8px;border:1px dashed var(--border);}
.edit-row.open{display:block;}
.edit-row label{font-size:11px;color:#475569;margin-top:6px;}
.edit-row .btn-action-row{display:flex;gap:6px;margin-top:10px;}
.btn-sm{padding:7px 14px;border-radius:7px;border:none;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;}
.btn-sm.primary{background:var(--red);color:#fff;}
.btn-sm.green{background:var(--green);color:#fff;}
.btn-sm.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
.btn-sm:active{transform:scale(.97);}

/* photos in edit */
.inline-photos{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.photo-box{width:50px;height:50px;border:2px dashed #cbd5e1;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;flex-shrink:0;}
.photo-box img{width:100%;height:100%;object-fit:cover;}
.photo-box .remove{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.6);color:#fff;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:8px;}
.photo-box .ph{font-size:8px;color:#94a3b8;text-align:center;}

/* add form card */
.add-card{display:none;margin-top:10px;}
.add-card.show{display:block;}

/* footer bar */
.submit-bar{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);
  padding:10px 14px;z-index:100;max-width:640px;margin:0 auto;
  box-shadow:0 -2px 10px rgba(0,0,0,.05);display:none;
}
.submit-bar.show{display:flex;gap:8px;}
.submit-bar .btn{flex:1;padding:13px;font-size:15px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 14px;border-radius:9px;border:none;font-size:14px;font-weight:700;
  cursor:pointer;transition:opacity .15s, transform .05s;font-family:inherit;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--green);color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;
  padding:12px 18px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;
  pointer-events:none;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;}

/* completed box */
.completed-box{background:#d1fae5;border:2px solid #16a34a;border-radius:12px;padding:16px 18px;margin:12px 0;text-align:center;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.completed-box .chk{font-size:28px;margin-bottom:4px;}
.completed-box .ttl{font-size:16px;font-weight:800;color:#166534;margin-bottom:2px;}
.completed-box .store{font-size:13px;color:#065f46;margin-bottom:8px;}
.completed-box .status-tag{font-size:12px;color:#047857;background:#a7f3d0;display:inline-block;padding:3px 12px;border-radius:20px;font-weight:600;margin-bottom:10px;}
.completed-box .btn{margin-top:10px;font-size:13px;}

/* recent history */
.history-item{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid #f1f5f9;font-size:11px;}
.history-item .hs-badge{font-size:10px;font-weight:600;padding:1px 7px;border-radius:4px;}
.history-item .hs-badge.pass{background:#dcfce7;color:#16a34a;}
.history-item .hs-badge.fail{background:#fef2f2;color:#dc2626;}

@media(max-width:480px){
  .topbar .t-title{font-size:14px}
  .item-card .t{font-size:13px}
  .row{flex-direction:column;gap:4px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="t-row">
    <div>
      <div class="t-title">🏪 Khảo sát vấn đề CSVC <span class="vbadge">v6.0</span></div>
      <div class="t-sub">Danh sách vấn đề · Cập nhật tình trạng · Thêm mới · Follow-up</div>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- ① CH Info -->
  <div class="card">
    <div class="card-head"><span class="dot"></span>① Cửa hàng khảo sát</div>
    <div class="card-body">
      <div class="row">
        <div><label>GĐV <span class="req-star">*</span></label><select id="selGdv"><option value="">— Chọn GĐV —</option></select></div>
        <div><label>QLKV <span class="req-star">*</span></label><select id="selQlkv" disabled><option value="">— Chọn QLKV —</option></select></div>
      </div>
      <label>Cửa hàng <span class="req-star">*</span></label>
      <select id="selCh" disabled><option value="">— Chọn Cửa hàng —</option></select>
      <div id="chInfo" style="display:none;margin-top:8px;font-size:12px;color:var(--muted);background:#f0fdf4;border-radius:8px;padding:8px 10px;">
        Tỉnh: <b id="pTinh">-</b> · Tên: <b id="pName">-</b>
      </div>
    </div>
  </div>

  <!-- Progress & Area Filters -->
  <div class="progress-wrap" id="progWrap">
    <div class="progress-top"><span class="progress-label">📊 Tiến độ</span><span class="progress-count" id="progCount">0/34</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    <div class="area-tabs" id="areaTabs"></div>
  </div>

  <!-- ② Danh sách vấn đề -->
  <div class="card" id="listCard" style="display:none;">
    <div class="card-head">
      <span class="dot"></span>② Danh sách vấn đề
      <span class="tag" id="tagCount">0 mục</span>
      <button class="btn-sm primary" id="btnAddNew" style="margin-left:auto;font-size:11px;" onclick="toggleAddForm()">➕ Thêm</button>
    </div>
    <div class="card-body">
      <div id="itemList"><div style="text-align:center;color:var(--muted);font-size:14px;padding:16px;">Chọn CH để xem danh sách vấn đề</div></div>
      <div style="text-align:center;margin-top:8px;" id="noChangeBar" hidden>
        <button class="btn btn-ghost" onclick="confirmNoChange()" style="border-color:var(--green);color:var(--green);font-size:13px;">✅ Xác nhận không thay đổi</button>
      </div>
    </div>
  </div>

  <!-- ③ Thêm vấn đề mới (hidden initially) -->
  <div class="card add-card" id="addCard">
    <div class="card-head"><span class="dot" style="background:var(--gold)"></span>③ <span id="formTitle">Thêm vấn đề mới</span></div>
    <div class="card-body">
      <div class="row">
        <div style="flex:0 0 40%;">
          <label>Khu vực <span class="req-star">*</span></label>
          <select id="addArea">
            <option value="">— Chọn —</option>
            <option>TRƯỚC CH</option>
            <option>TRONG CH</option>
            <option>KHO - NVS</option>
          </select>
        </div>
        <div style="flex:1;">
          <label>Tên hạng mục <span class="req-star">*</span></label>
          <input type="text" id="addItemName" placeholder="VD: Mái tôn phía sau CH bị dột">
        </div>
      </div>
      <label>Đánh giá <span class="req-star">*</span></label>
      <div class="row" style="gap:10px;margin-top:4px;">
        <button class="btn" id="addBtnPass" onclick="setAddEval('pass')" style="flex:1;background:#f0fdf4;color:var(--green);border:2px solid transparent;">✅ Đạt</button>
        <button class="btn" id="addBtnFail" onclick="setAddEval('fail')" style="flex:1;background:#fef2f2;color:var(--red);border:2px solid transparent;">❌ Ko đạt</button>
      </div>
      <div id="addFailDetail" style="display:none;">
        <label>📝 Diễn giải tình trạng <span class="req-star">*</span></label>
        <textarea id="addNote" placeholder="Mô tả tình trạng hư hỏng/xuống cấp..."></textarea>
        <label>📸 Ảnh minh họa (tối đa 3)</label>
        <div class="inline-photos" id="addPhotos">
          <div class="photo-box" onclick="document.getElementById('addFileInput').click()"><span class="ph">+ Ảnh</span></div>
        </div>
        <input type="file" id="addFileInput" accept="image/*" capture="environment" style="display:none" onchange="addPhoto(this)">
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-blue" id="btnSaveAdd" onclick="saveAddForm()" style="flex:1;">➕ Thêm vào danh sách</button>
        <button class="btn btn-ghost" onclick="cancelAdd()">Huỷ</button>
      </div>
    </div>
  </div>

  <!-- Recent history -->
  <div class="card" id="historyCard" style="display:none;">
    <div class="card-head"><span class="dot" style="background:var(--blue)"></span>📋 Lịch sử khảo sát gần đây</div>
    <div class="card-body" id="historyList"><div style="color:var(--muted);font-size:13px;text-align:center;padding:8px;">Chưa có dữ liệu</div></div>
  </div>
</div>

<!-- Submit bar -->
<div class="submit-bar" id="submitBar">
  <button class="btn btn-ghost" onclick="confirmNoChange()" style="border-color:var(--green);color:var(--green);">✅ Không đổi</button>
  <button class="btn btn-primary" onclick="submitAll()">💾 Lưu khảo sát</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzxPXoDhsPYDe7RbBBfGyW8shFxsB3Q6sv7SvxKSP31H9uKOvtGLSyoHRSRUj-jo3Mo/exec';
var STORELIST_CSV = 'https://docs.google.com/spreadsheets/d/1fMmEm1GC9aei_3oeu2vcadPVsUM9ms9eVhm99d7pF8A/gviz/tq?tqx=out:csv&gid=900581387';

// ── STATE ──
var cascadeData = {};
var checklistAreas = [];     // [{name, items}] — 34 mục chuẩn
var itemEntries = [];        // [{id, area, name, eval, note, photos, _custom}]
var selectedStore = null;
var activeArea = 'all';     // filter
var editingItemId = null;
var addEval = null;
var addPhotos = [];
var isSubmitting = false;

// ── TOAST ──
var toastTimer;
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show');},2600); }

// ── INIT ──
async function init(){
  var hint = document.getElementById('chInfo');
  
  // Load checklist from GAS
  try{
    var resp = await fetch(GAS_URL + '?action=checklist');
    if(resp.ok){
      var data = await resp.json();
      if(Array.isArray(data) && data.length > 0){
        checklistAreas = data;
      }
    }
  }catch(e){ console.warn('Checklist fetch failed:', e.message); }
  
  // Fallback checklist
  if(!checklistAreas.length){
    checklistAreas = [
      {name:'TRƯỚC CH',items:['Biển hiệu WM+','Mặt tiền/ sơn tường ngoài','Cửa cuốn/ cửa kính','Mái hiên/ mái che','Đèn chiếu sáng ngoài','Vỉa hè','Biển quảng cáo/Poster','Cây xanh','Thùng rác ngoài','Camera an ninh ngoài']},
      {name:'TRONG CH',items:['Trần nhà/ thạch cao','Tường','Đèn chiếu sáng','Điều hòa/ quạt/ thông gió','Kệ trưng bày','Tủ mát/ tủ đông/ tủ lạnh','Bảng giá','Giỏ hàng/ xe đẩy','Quầy thu ngân','Cân điện tử','Wifi/ Mạng/ Thiết bị IT','Hạng mục khác','Hệ thống âm thanh','Bình chữa cháy/ PCCC','Ổ điện, hệ thống điện','Camera an ninh trong']},
      {name:'KHO - NVS',items:['Cửa kho / cửa NVS','Kệ kho/ Palet','Sàn kho / NVS','Đường điện','Thiết bị vệ sinh','Đường nước','Thiết bị nhà vệ sinh','Sàn kho / NVS (tổng thể)']}
    ];
  }
  
  buildItemEntries();
  buildAreaTabs();
  
  // Load store data via GAS or CSV fallback
  try{
    var storeResp = await fetch(GAS_URL + '?action=storeData');
    if(storeResp.ok){
      var storeRows = await storeResp.json();
      if(Array.isArray(storeRows) && storeRows.length > 0){
        cascadeData = {};
        for(var j=0; j<storeRows.length; j++){
          var r = storeRows[j];
          var g = r.gdv||'Chưa phân công';
          var q = r.qlkv||'Chưa phân công';
          if(!cascadeData[g]) cascadeData[g]={};
          if(!cascadeData[g][q]) cascadeData[g][q]=[];
          cascadeData[g][q].push({sid:r.ma,name:r.ten,tinh:r.tinh});
        }
        populateGdv();
      }
    }else{
      throw new Error('HTTP '+storeResp.status);
    }
  }catch(e){
    console.warn('Store GAS fetch failed, trying CSV:', e.message);
    try{
      var csvResp = await fetch(STORELIST_CSV);
      var text = await csvResp.text();
      var rows = parseCSV(text);
      cascadeData = {};
      for(var i=0; i<rows.length; i++){
        var r = rows[i];
        if((r['Tình Trạng']||'').trim()!=='Đang hoạt động') continue;
        var g = r['GĐV']||'Chưa phân công';
        var q = r['QLKV']||'Chưa phân công';
        if(!cascadeData[g]) cascadeData[g]={};
        if(!cascadeData[g][q]) cascadeData[g][q]=[];
        cascadeData[g][q].push({sid:r['Mã SAP']||'',name:r['Tên cửa hàng']||'',tinh:r['Tỉnh/TP']||''});
      }
      populateGdv();
      document.getElementById('chInfo').innerHTML='✅ Đã tải dữ liệu Storelist (CSV)';
    }catch(ee){
      document.getElementById('chInfo').innerHTML='⚠️ Không tải được dữ liệu CH. Cần deploy Code.gs.';
      document.getElementById('chInfo').style.display='block';
      console.warn('Store CSV fetch failed:', ee.message);
    }
  }
}

function populateGdv(){
  var sel = document.getElementById('selGdv');
  var keys = Object.keys(cascadeData).sort();
  sel.innerHTML = '<option value="">— Chọn GĐV —</option>';
  for(var i=0; i<keys.length; i++){
    var g = keys[i];
    sel.innerHTML += '<option value="'+g+'">'+g+' ('+Object.keys(cascadeData[g]).length+' QLKV)</option>';
  }
}

function buildItemEntries(){
  itemEntries = [];
  var num = 1;
  for(var a=0; a<checklistAreas.length; a++){
    var area = checklistAreas[a];
    for(var i=0; i<area.items.length; i++){
      itemEntries.push({
        id: 'std_'+a+'_'+i,
        area: area.name,
        name: area.items[i],
        num: num++,
        eval: null,    // null | 'pass' | 'fail'
        note: '',
        photos: [],
        _custom: false,
        _changed: false
      });
    }
  }
}

function buildAreaTabs(){
  var html = '<button class="area-tab active" onclick="filterArea(\'all\')">Tất cả</button>';
  for(var a=0; a<checklistAreas.length; a++){
    html += '<button class="area-tab" onclick="filterArea(\''+a+'\')">'+checklistAreas[a].name+' <span class="cnt">('+checklistAreas[a].items.length+')</span></button>';
  }
  document.getElementById('areaTabs').innerHTML = html;
}

function parseCSV(text){ /* same as doi-thu parser */ 
  var rows=[],row=[],cur='',inQ=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=c; }
    else if(c==='"') inQ=true;
    else if(c===','){ row.push(cur);cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1)rows.push(row);row=[]; }
    else cur+=c;
  }
  row.push(cur);if(row.length>1)rows.push(row);
  if(rows.length<2)return[];
  var header=rows[0].map(function(h){return h.trim();});
  return rows.slice(1).map(function(r){var o={};header.forEach(function(h,i){o[h]=r[i];});return o;});
}

// ── CASCADE ──
document.getElementById('selGdv').addEventListener('change',function(){
  var g=this.value;
  var qSel=document.getElementById('selQlkv');
  qSel.innerHTML='<option value="">— Chọn QLKV —</option>';
  document.getElementById('selCh').innerHTML='<option value="">— Chọn Cửa hàng —</option>';
  document.getElementById('selCh').disabled=true;
  hideSurvey();
  if(!g||!cascadeData[g]){ qSel.disabled=true; return; }
  qSel.disabled=false;
  var qKeys=Object.keys(cascadeData[g]).sort();
  for(var i=0;i<qKeys.length;i++){
    var q=qKeys[i];
    qSel.innerHTML+='<option value="'+q+'">'+q+' ('+cascadeData[g][q].length+' CH)</option>';
  }
});
document.getElementById('selQlkv').addEventListener('change',function(){
  var g=document.getElementById('selGdv').value;
  var q=this.value;
  var sSel=document.getElementById('selCh');
  sSel.innerHTML='<option value="">— Chọn Cửa hàng —</option>';
  hideSurvey();
  if(!g||!q||!cascadeData[g]||!cascadeData[g][q]){ sSel.disabled=true; return; }
  sSel.disabled=false;
  var stores=cascadeData[g][q].sort(function(a,b){return a.sid.localeCompare(b.sid);});
  for(var i=0;i<stores.length;i++){
    var s=stores[i];
    sSel.innerHTML+='<option value="'+s.sid+'" data-name="'+s.name+'" data-tinh="'+s.tinh+'">'+s.sid+' - '+s.name+'</option>';
  }
});
document.getElementById('selCh').addEventListener('change',function(){
  var opt=this.selectedOptions[0];
  if(opt && opt.dataset.name){
    selectedStore = {ma:opt.value, ten:opt.dataset.name, tinh:opt.dataset.tinh};
    document.getElementById('pTinh').textContent=opt.dataset.tinh;
    document.getElementById('pName').textContent=opt.dataset.name;
    document.getElementById('chInfo').style.display='block';
    showSurvey();
    resetAllItems();
    loadHistory();
  } else {
    hideSurvey();
  }
});

function hideSurvey(){
  document.getElementById('listCard').style.display='none';
  document.getElementById('progWrap').classList.remove('show');
  document.getElementById('addCard').classList.remove('show');
  document.getElementById('submitBar').classList.remove('show');
  document.getElementById('historyCard').style.display='none';
  selectedStore = null;
}
function showSurvey(){
  document.getElementById('listCard').style.display='block';
  document.getElementById('progWrap').classList.add('show');
  document.getElementById('submitBar').classList.add('show');
  document.getElementById('historyCard').style.display='block';
}

// ── RESET ALL ITEMS ──
function resetAllItems(){
  buildItemEntries();
  activeArea = 'all';
  editingItemId = null;
  cancelAdd();
  renderList();
  updateProgress();
  document.getElementById('addCard').classList.remove('show');
  // reset area tab active
  var tabs = document.querySelectorAll('.area-tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
  if(tabs[0]) tabs[0].classList.add('active');
}

// ── FILTER ──
function filterArea(idx){
  activeArea = idx==='all' ? 'all' : parseInt(idx);
  var tabs=document.querySelectorAll('.area-tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
  var target = idx==='all'? 0 : parseInt(idx)+1;
  if(tabs[target]) tabs[target].classList.add('active');
  editingItemId = null;
  renderList();
}

// ── RENDER LIST ──
function renderList(){
  var container = document.getElementById('itemList');
  var filtered = itemEntries;
  if(activeArea !== 'all'){
    var areaName = checklistAreas[activeArea].name;
    filtered = itemEntries.filter(function(e){ return e.area === areaName; });
  }
  
  var passCount=0,failCount=0,total=itemEntries.length;
  for(var i=0;i<itemEntries.length;i++){
    if(itemEntries[i].eval==='pass') passCount++;
    else if(itemEntries[i].eval==='fail') failCount++;
  }
  document.getElementById('tagCount').textContent = total+' mục · ✅'+passCount+' ❌'+failCount;
  
  if(filtered.length===0){
    container.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:14px;padding:16px;">Chưa có hạng mục nào</div>';
    return;
  }
  
  var html = '';
  for(var i=0;i<filtered.length;i++){
    var e = filtered[i];
    var isOpen = editingItemId === e.id;
    var cls = '';
    var badge = '<span class="badge pend">⬜ Chưa</span>';
    if(e.eval==='pass'){ cls='eval-pass'; badge='<span class="badge pass">✅ Đạt</span>'; }
    else if(e.eval==='fail'){ cls='eval-fail'; badge='<span class="badge fail">❌ Ko đạt</span>'; }
    if(e._custom) badge += ' <span class="badge new">MỚI</span>';
    if(e._changed && !e._custom) badge += ' <span class="badge new">đã sửa</span>';
    
    var sub = '';
    if(e.eval==='fail' && e.note) sub = e.note.substring(0,60)+(e.note.length>60?'...':'');
    else if(e.eval==='pass') sub = 'Tình trạng tốt';
    else sub = 'Chưa đánh giá';
    if(e.photos && e.photos.length) sub += ' · 📸 '+e.photos.length+' ảnh';
    
    html += '<div class="item-card '+cls+'" onclick="toggleEdit(\''+e.id+'\', event)">';
    html += '<div class="idx">'+(e._custom?'+':e.num)+'</div>';
    html += '<div class="body">';
    html += '<div class="t">'+e.name+badge+'</div>';
    html += '<div class="sub">'+sub+'</div>';
    
    // Edit row
    html += '<div class="edit-row'+(isOpen?' open':'')+'" id="edit_'+e.id+'">';
    html += '<div class="row" style="gap:10px;margin-top:4px;">';
    html += '<button class="btn-sm green" style="flex:1;" onclick="quickEval(event,\''+e.id+'\',\'pass\')">✅ Đạt</button>';
    html += '<button class="btn-sm" style="flex:1;background:#fef2f2;color:var(--red);border:1px solid #fecaca;" onclick="quickEval(event,\''+e.id+'\',\'fail\')">❌ Ko đạt</button>';
    html += '</div>';
    html += '<div id="failSection_'+e.id+'" style="display:'+(e.eval==='fail'?'block':'none')+'">';
    html += '<label>📝 Diễn giải</label><textarea id="note_'+e.id+'" placeholder="Mô tả tình trạng..." oninput="markChanged(\''+e.id+'\')">'+(e.note||'')+'</textarea>';
    html += '<label>📸 Ảnh</label><div class="inline-photos" id="photos_'+e.id+'"></div>';
    html += '<input type="file" id="file_'+e.id+'" accept="image/*" capture="environment" style="display:none" onchange="editAddPhoto(this,\''+e.id+'\')">';
    html += '</div>';
    html += '</div>';
    
    html += '</div></div>';
  }
  container.innerHTML = html;
  
  // Re-render photos for fail items
  for(var i=0;i<itemEntries.length;i++){
    renderEditPhotos(itemEntries[i].id);
  }
  
  updateProgress();
}

function toggleEdit(id, ev){
  ev.stopPropagation();
  editingItemId = (editingItemId === id) ? null : id;
  renderList();
}

function quickEval(ev, id, value){
  ev.stopPropagation();
  var entry = itemEntries.find(function(e){return e.id===id;});
  if(!entry) return;
  entry.eval = value;
  entry._changed = true;
  if(value==='pass'){ entry.note=''; entry.photos=[]; }
  renderList();
  // Auto-expand if fail
  if(value==='fail'){
    editingItemId = id;
    renderList();
    var ta = document.getElementById('note_'+id);
    if(ta) ta.focus();
  }
}

function markChanged(id){
  var entry = itemEntries.find(function(e){return e.id===id;});
  if(entry) entry._changed = true;
}

function renderEditPhotos(id){
  var container = document.getElementById('photos_'+id);
  if(!container) return;
  var entry = itemEntries.find(function(e){return e.id===id;});
  if(!entry){ container.innerHTML=''; return; }
  var photos = entry.photos||[];
  var html = '';
  for(var i=0;i<photos.length;i++){
    var src = typeof photos[i]==='string'? photos[i] : photos[i].dataUrl;
    html += '<div class="photo-box"><img src="'+src+'"><span class="remove" onclick="removeEditPhoto(event,\''+id+'\','+i+')">✕</span></div>';
  }
  if(photos.length < 3){
    html += '<div class="photo-box" onclick="document.getElementById(\'file_'+id+'\').click()"><span class="ph">+ Ảnh</span></div>';
  }
  container.innerHTML = html;
}

function editAddPhoto(input, id){
  if(!input.files||!input.files[0]) return;
  var file=input.files[0];
  var reader=new FileReader();
  reader.onload=function(e){
    var entry=itemEntries.find(function(x){return x.id===id;});
    if(!entry) return;
    if(!entry.photos) entry.photos=[];
    if(entry.photos.length>=3) return;
    entry.photos.push({dataUrl:e.target.result,name:file.name});
    entry._changed=true;
    renderEditPhotos(id);
  };
  reader.readAsDataURL(file);
  input.value='';
}

function removeEditPhoto(ev, id, idx){
  ev.stopPropagation();
  var entry=itemEntries.find(function(e){return e.id===id;});
  if(!entry||!entry.photos) return;
  entry.photos.splice(idx,1);
  entry._changed=true;
  renderEditPhotos(id);
}

// ── ADD NEW ITEM FORM ──
function toggleAddForm(){
  var card = document.getElementById('addCard');
  if(card.classList.contains('show')){ cancelAdd(); return; }
  card.classList.add('show');
  document.getElementById('formTitle').textContent='Thêm vấn đề mới';
  card.scrollIntoView({behavior:'smooth',block:'center'});
}

function setAddEval(value){
  addEval = value;
  document.getElementById('addBtnPass').style.border = value==='pass'?'2px solid var(--green)':'2px solid transparent';
  document.getElementById('addBtnFail').style.border = value==='fail'?'2px solid var(--red)':'2px solid transparent';
  document.getElementById('addFailDetail').style.display = value==='fail'?'block':'none';
}

function addPhoto(input){
  if(!input.files||!input.files[0]) return;
  var file=input.files[0];
  var reader=new FileReader();
  reader.onload=function(e){
    if(addPhotos.length>=3) return;
    addPhotos.push({dataUrl:e.target.result,name:file.name});
    renderAddPhotos();
  };
  reader.readAsDataURL(file);
  input.value='';
}

function removeAddPhoto(ev,idx){
  ev.stopPropagation();
  addPhotos.splice(idx,1);
  renderAddPhotos();
}

function renderAddPhotos(){
  var container=document.getElementById('addPhotos');
  var html='';
  for(var i=0;i<addPhotos.length;i++){
    html+='<div class="photo-box"><img src="'+addPhotos[i].dataUrl+'"><span class="remove" onclick="removeAddPhoto(event,'+i+')">✕</span></div>';
  }
  if(addPhotos.length<3){
    html+='<div class="photo-box" onclick="document.getElementById(\'addFileInput\').click()"><span class="ph">+ Ảnh</span></div>';
  }
  container.innerHTML=html;
}

function saveAddForm(){
  var area = document.getElementById('addArea').value;
  var name = document.getElementById('addItemName').value.trim();
  if(!area){ toast('⚠️ Chọn khu vực'); return; }
  if(!name){ toast('⚠️ Nhập tên hạng mục'); return; }
  if(!addEval){ toast('⚠️ Chọn Đạt hoặc Ko đạt'); return; }
  if(addEval==='fail'){
    var note=document.getElementById('addNote').value.trim();
    if(!note){ toast('⚠️ Nhập diễn giải cho mục Ko đạt'); return; }
    if(addPhotos.length===0){ toast('⚠️ Cần ít nhất 1 ảnh cho mục Ko đạt'); return; }
  }
  
  var maxCustom=0;
  for(var i=0;i<itemEntries.length;i++){
    if(itemEntries[i]._custom){
      var m=itemEntries[i].id.match(/^cust_(\d+)$/);
      if(m&&parseInt(m[1])>maxCustom) maxCustom=parseInt(m[1]);
    }
  }
  
  itemEntries.push({
    id: 'cust_'+(maxCustom+1),
    area: area,
    name: name,
    num: null,
    eval: addEval,
    note: addEval==='fail'? document.getElementById('addNote').value.trim() : '',
    photos: addEval==='fail'? addPhotos.slice() : [],
    _custom: true,
    _changed: true
  });
  
  cancelAdd();
  document.getElementById('addCard').classList.remove('show');
  activeArea='all';
  var tabs=document.querySelectorAll('.area-tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
  if(tabs[0]) tabs[0].classList.add('active');
  renderList();
  updateProgress();
  toast('✅ Đã thêm: '+name);
}

function cancelAdd(){
  addEval=null;
  addPhotos=[];
  document.getElementById('addArea').value='';
  document.getElementById('addItemName').value='';
  document.getElementById('addNote').value='';
  document.getElementById('addBtnPass').style.border='2px solid transparent';
  document.getElementById('addBtnFail').style.border='2px solid transparent';
  document.getElementById('addFailDetail').style.display='none';
  renderAddPhotos();
}

// ── PROGRESS ──
function updateProgress(){
  var total=itemEntries.length, done=0;
  for(var i=0;i<itemEntries.length;i++){ if(itemEntries[i].eval) done++; }
  var pct=total>0?Math.round(done/total*100):0;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progCount').textContent=done+'/'+total;
}

// ── NO CHANGE ──
function confirmNoChange(){
  if(!selectedStore){ toast('⚠️ Chọn CH trước'); return; }
  
  // Check if there are any changes
  var changed=itemEntries.filter(function(e){return e._changed;});
  if(changed.length>0){
    // Has changes → submit them
    submitAll();
    return;
  }
  
  if(isSubmitting){ toast('⚠️ Đang lưu...'); return; }
  isSubmitting=true;
  var btn=document.querySelector('#submitBar .btn-ghost');
  btn.textContent='⏳ Đang lưu...';
  btn.disabled=true;
  
  var payload = {
    action: 'nochange',
    store: selectedStore.ma, storeName: selectedStore.ten, tinh: selectedStore.tinh,
    gdv: document.getElementById('selGdv').value,
    qlkv: document.getElementById('selQlkv').value,
    timestamp: new Date().toISOString()
  };
  
  if(GAS_URL){
    fetch(GAS_URL, {method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
      .then(function(){ showCompleted('không đổi'); })
      .catch(function(){ toast('⚠️ Lỗi kết nối, dữ liệu chỉ lưu tạm'); showCompleted('không đổi'); })
      .finally(function(){ isSubmitting=false; });
  } else {
    showCompleted('không đổi');
    isSubmitting=false;
  }
}

// ── SUBMIT ALL ──
function submitAll(){
  if(!selectedStore){ toast('⚠️ Chọn CH trước'); return; }
  if(isSubmitting){ toast('⚠️ Đang lưu...'); return; }
  
  // Validate: all items must be evaluated
  var uneval = itemEntries.filter(function(e){return !e.eval;});
  if(uneval.length>0){
    toast('⚠️ Còn '+uneval.length+' mục chưa đánh giá!');
    return;
  }
  
  // Validate fail items have note + photo
  var failNoNote = itemEntries.filter(function(e){return e.eval==='fail' && (!e.note||!e.note.trim());});
  if(failNoNote.length>0){ toast('⚠️ '+failNoNote.length+' mục Ko đạt chưa có diễn giải!'); return; }
  var failNoPhoto = itemEntries.filter(function(e){return e.eval==='fail' && (!e.photos||e.photos.length===0);});
  if(failNoPhoto.length>0){ toast('⚠️ '+failNoPhoto.length+' mục Ko đạt chưa có ảnh!'); return; }
  
  isSubmitting=true;
  document.querySelector('#submitBar .btn-primary').textContent='⏳ Đang lưu...';
  document.querySelector('#submitBar .btn-primary').disabled=true;
  document.querySelector('#submitBar .btn-ghost').disabled=true;
  
  var passCount=0,failCount=0;
  var items=[];
  for(var i=0;i<itemEntries.length;i++){
    var e=itemEntries[i];
    if(e.eval==='pass') passCount++; else if(e.eval==='fail') failCount++;
    items.push({
      area: e.area,
      item: e.name,
      result: e.eval==='pass'?'Đạt':'Không đạt',
      note: e.eval==='pass'?'Đạt':(e.note||''),
      photos: e.photos||[],
      _custom: e._custom
    });
  }
  
  var payload = {
    store: selectedStore.ma,
    storeName: selectedStore.ten,
    tinh: selectedStore.tinh,
    gdv: document.getElementById('selGdv').value,
    qlkv: document.getElementById('selQlkv').value,
    items: items,
    generalNote: '',
    totalItems: itemEntries.length,
    passCount: passCount,
    failCount: failCount
  };
  
  if(GAS_URL){
    fetch(GAS_URL, {method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
      .then(function(r){return r.json();})
      .then(function(res){
        if(res.success) showCompleted('đã cập nhật', res.rowsSaved);
        else showCompleted('đã lưu (lỗi server)', 0);
      })
      .catch(function(){ showCompleted('đã lưu tạm', 0); })
      .finally(function(){ isSubmitting=false; });
  } else {
    showCompleted('đã lưu tạm (chưa có GAS)', 0);
    isSubmitting=false;
  }
}

// ── COMPLETED ──
function showCompleted(trangThai, rowsSaved){
  var old = document.getElementById('completedBox');
  if(old) old.remove();
  
  var box=document.createElement('div');
  box.id='completedBox';
  box.className='completed-box';
  
  var passCount=0,failCount=0;
  for(var i=0;i<itemEntries.length;i++){
    if(itemEntries[i].eval==='pass') passCount++;
    else if(itemEntries[i].eval==='fail') failCount++;
  }
  
  box.innerHTML = 
    '<div class="chk">✅</div>'+
    '<div class="ttl">Đã hoàn thành khảo sát!</div>'+
    '<div class="store">'+selectedStore.ma+' — '+selectedStore.ten+'</div>'+
    '<div class="status-tag">✅ '+passCount+' Đạt · ❌ '+failCount+' Ko đạt · '+itemEntries.length+' mục'+(rowsSaved?' · '+rowsSaved+' dòng đã lưu':'')+'</div>'+
    '<div style="margin-top:8px"><button class="btn btn-blue" onclick="doNewSurvey()">🔍 Khảo sát CH khác</button></div>';
  
  document.getElementById('listCard').querySelector('.card-body').appendChild(box);
  box.scrollIntoView({behavior:'smooth',block:'center'});
  
  document.getElementById('submitBar').classList.remove('show');
}

function doNewSurvey(){
  var box=document.getElementById('completedBox');
  if(box) box.remove();
  document.getElementById('selGdv').value='';
  document.getElementById('selQlkv').innerHTML='<option value="">— Chọn QLKV —</option>';
  document.getElementById('selQlkv').disabled=true;
  document.getElementById('selCh').innerHTML='<option value="">— Chọn Cửa hàng —</option>';
  document.getElementById('selCh').disabled=true;
  document.getElementById('chInfo').style.display='none';
  hideSurvey();
  buildItemEntries();
  isSubmitting=false;
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── LOAD HISTORY ──
async function loadHistory(){
  if(!GAS_URL){ return; }
  try{
    var resp = await fetch(GAS_URL+'?action=history&store='+encodeURIComponent(selectedStore.ma));
    if(!resp.ok) return;
    var data = await resp.json();
    if(!Array.isArray(data) || data.length===0){
      document.getElementById('historyList').innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;padding:8px;">Chưa có lịch sử khảo sát cho CH này</div>';
      return;
    }
    var html='';
    for(var i=0;i<Math.min(data.length,5);i++){
      var h=data[i];
      html+='<div class="history-item"><span>'+h.date+'</span> <span class="hs-badge pass">✅ '+h.pass+'</span> <span class="hs-badge fail">❌ '+h.fail+'</span></div>';
    }
    document.getElementById('historyList').innerHTML=html;
  }catch(e){
    document.getElementById('historyList').innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;padding:8px;">⚠️ Chưa load được lịch sử</div>';
  }
}

// ── START ──
init();
</script>
